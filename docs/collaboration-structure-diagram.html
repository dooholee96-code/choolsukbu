<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육청-대학교 협력 체계 도식 (편집 가능)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  :root { --rose: #e11d48; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background-color: #e2e8f0;
    margin: 0;
    padding: 78px 40px 96px;
    display: flex; justify-content: center; align-items: flex-start;
  }

  /* ================= 상단 툴바 / 하단 속성바 ================= */
  .bar {
    position: fixed; left: 0; right: 0;
    background: #0f172a;
    display: flex; align-items: center; gap: 10px;
    padding: 0 18px;
    z-index: 2000;
    overflow-x: auto;
  }
  .toolbar { top: 0; height: 58px; box-shadow: 0 3px 12px rgba(0,0,0,.25); }
  .propbar { bottom: 0; min-height: 76px; background: #111c33; box-shadow: 0 -3px 12px rgba(0,0,0,.25); flex-wrap: wrap; padding: 10px 18px; }

  .tb-group { display: flex; align-items: center; gap: 6px; }
  .tb-sep { width: 1px; height: 26px; background: #334155; margin: 0 6px; flex-shrink: 0; }
  .tb-label { color: #94a3b8; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .tb-btn {
    background: #1e293b; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px;
    padding: 8px 13px; font-size: 13px; font-weight: 700;
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .tb-btn:hover { background: #334155; }
  .tb-btn:active { transform: translateY(1px); }
  .tb-btn.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .tb-btn.on { background: #3b82f6; border-color: #60a5fa; color: #fff; }
  .tb-btn.danger { background: #7f1d1d; border-color: #b91c1c; color: #fecaca; }
  .tb-btn.icon { padding: 8px 12px; font-size: 15px; min-width: 38px; }
  .tb-status { color: #64748b; font-size: 12px; font-weight: 600; margin-left: auto; white-space: nowrap; padding-left: 12px; }

  .pb-hint { color: #64748b; font-size: 13px; font-weight: 600; }
  .pb-sec { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  [hidden] { display: none !important; }   /* .pb-sec 의 display 가 [hidden] 을 덮지 않도록 */
  .pb-title { color: #f1f5f9; font-size: 13px; font-weight: 800; margin-right: 4px; white-space: nowrap; }
  .sw { width: 26px; height: 26px; border-radius: 7px; border: 2px solid #334155; cursor: pointer; padding: 0; }
  .sw.on { border-color: #fff; }
  input[type=range] { width: 130px; accent-color: #3b82f6; }

  /* ================= 슬라이드 ================= */
  .presentation-slide {
    background: #fff; width: 1440px;
    border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.1);
    padding: 32px 60px 28px; position: relative;
    display: flex; flex-direction: column;
  }
  .title { text-align:center; font-size:34px; font-weight:800; color:#1e293b; margin:0 0 4px; letter-spacing:-1px; }
  .subtitle { text-align:center; font-size:15px; font-weight:600; color:#64748b; margin:0 0 16px; }

  .canvas { position: relative; width: 1320px; height: 700px; flex-shrink: 0; touch-action: none; }
  svg.wires { position:absolute; inset:0; width:100%; height:100%; z-index:2; pointer-events:none; overflow:visible; }
  svg.wires .hit { pointer-events: stroke; cursor: pointer; }

  /* ================= 노드 ================= */
  .nd { position: absolute; z-index: 3; cursor: grab; user-select: none; }
  .nd .shape { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .nd-body {
    position: relative; z-index: 1; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; line-height: 1.35;
  }
  .nd.dragging { cursor: grabbing; z-index: 50; }
  .nd.sel .shape { filter: drop-shadow(0 0 0 #3b82f6); }
  .nd.sel::after {
    content:''; position:absolute; inset:-6px;
    border: 3px solid #3b82f6; border-radius: 12px; pointer-events: none;
  }
  .nd .n-title { font-weight: 800; letter-spacing: -0.4px; }
  .nd .n-desc  { font-weight: 600; opacity: .9; margin-top: 5px; }
  .nd .n-desc:empty { display: none; }

  [contenteditable="true"] { cursor: text; user-select: text; }
  [contenteditable="true"]:focus { outline: 2px solid #3b82f6; border-radius: 4px; background: rgba(255,255,255,.9); }

  /* 텍스트 편집 모드 */
  body.edit-mode .nd { cursor: text; }
  body.edit-mode .nd [data-f] { outline: 1px dashed rgba(59,130,246,.55); outline-offset: 2px; border-radius: 4px; }
  body.edit-mode .nd .n-desc:empty { display: block; min-width: 90px; min-height: 1.2em; outline: 1px dashed rgba(59,130,246,.55); }
  body.edit-mode .nd .n-desc:empty::before { content: '설명 입력'; color: #94a3b8; font-size: 11px; }
  body.edit-mode .guide { display: none !important; }
  /* 연결선 추가 모드 */
  body.linking .nd { cursor: crosshair; }

  .badge {
    position:absolute; top:-14px;
    color:#fff; font-size:12.5px; font-weight:800;
    padding:5px 12px; border-radius:20px;
    letter-spacing:-0.5px; white-space:nowrap;
    z-index:4; pointer-events:none;
  }
  .badge.r { right:-10px; background:var(--rose); box-shadow:0 4px 8px rgba(225,29,72,.4); }
  .badge.l { left:-10px;  background:#0891b2; box-shadow:0 4px 8px rgba(8,145,178,.35); }

  #councilGroup {
    position:absolute; z-index:1;
    background: rgba(255,241,242,.85);
    border: 3px dashed var(--rose); border-radius: 18px;
  }
  #councilGroup .badge { top:-15px; left:-6px; right:auto; background:var(--rose); box-shadow:0 4px 8px rgba(225,29,72,.4); }

  .guide { position:absolute; background:#f43f5e; z-index:60; pointer-events:none; display:none; }
  .guide.h { left:0; width:100%; height:1px; }
  .guide.v { top:0; height:100%; width:1px; }

  .peer-note { position:absolute; z-index:3; font-size:13px; font-weight:700; color:#64748b; }

  /* ================= 범례 ================= */
  .legend-bar {
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:10px 28px; margin-top:14px; padding:12px 18px; border-top:2px solid #e2e8f0;
  }
  .lg { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:#475569; }
  .swatch { display:inline-block; width:24px; height:14px; flex-shrink:0; background:#fff1f2; border:2px dashed var(--rose); border-radius:5px; }
</style>
</head>
<body>

<!-- ===================== 상단 툴바 ===================== -->
<div class="bar toolbar">
  <span class="tb-label">정렬</span>
  <div class="tb-group">
    <button class="tb-btn" onclick="alignRows()" title="같은 급(행)의 객체들을 수평으로 맞춥니다">⇔ 동급 수평 정렬</button>
    <button class="tb-btn" onclick="alignCols()" title="같은 축(열)의 객체들을 수직으로 맞춥니다">⇕ 축 수직 정렬</button>
    <button class="tb-btn" onclick="distributeRows()" title="행 간격을 균등하게 맞춥니다">≡ 행 간격 균등</button>
  </div>
  <div class="tb-sep"></div>

  <span class="tb-label">폰트</span>
  <div class="tb-group">
    <button class="tb-btn icon" onclick="bumpFont('title',-1)">가﹣</button>
    <span class="tb-label" id="fsVal">–</span>
    <button class="tb-btn icon" onclick="bumpFont('title',1)">가﹢</button>
    <button class="tb-btn" onclick="bumpFont('desc',-1)">설명﹣</button>
    <button class="tb-btn" onclick="bumpFont('desc',1)">설명﹢</button>
    <button class="tb-btn icon" onclick="bumpAllFont(-1)" title="전체 폰트 축소">전체﹣</button>
    <button class="tb-btn icon" onclick="bumpAllFont(1)" title="전체 폰트 확대">전체﹢</button>
  </div>
  <div class="tb-sep"></div>

  <div class="tb-group">
    <button class="tb-btn" id="editBtn" onclick="toggleEditMode()" title="모든 글자를 클릭 한 번으로 수정 (이동 잠금)">✏️ 텍스트 편집</button>
    <button class="tb-btn" id="linkBtn" onclick="toggleLinking()" title="객체 두 개를 차례로 클릭하면 화살표가 생깁니다">🔗 연결선 추가</button>
    <button class="tb-btn" onclick="resetLayout()">↺ 초기 상태로</button>
    <button class="tb-btn primary" onclick="saveAsImage()">📸 PPT용 이미지 저장</button>
  </div>
  <span class="tb-status" id="status"></span>
</div>

<!-- ===================== 슬라이드 ===================== -->
<div class="presentation-slide" id="slide-container">
  <h1 class="title" data-k="title" contenteditable="true">교육청-대학교 협력 체계 도식</h1>
  <p class="subtitle" data-k="subtitle" contenteditable="true">3개 축 · 3단 동급 편제 · 소통 채널 및 보고 · 결재 라인</p>

  <div class="canvas" id="canvas">
    <div class="guide h" id="guideH"></div>
    <div class="guide v" id="guideV"></div>

    <div id="councilGroup"><span class="badge" contenteditable="false">실무협의체 ③ (1객체)</span></div>

    <svg class="wires" id="wires" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs"></defs>
      <g id="edges"></g>
    </svg>

    <div class="peer-note" id="peerNote" data-k="peerNote" contenteditable="true" style="left:1152px; top:494px;">※ 3개 기관 서로 동급</div>
  </div>

  <div class="legend-bar">
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#64748b" stroke-width="3"/></svg><span data-k="lg1" contenteditable="true">동급 소통</span></span>
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/></svg><span data-k="lg2" contenteditable="true">교육협력관 소통</span></span>
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 4"/></svg><span data-k="lg3" contenteditable="true">교육협력과 소통</span></span>
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#7c3aed" stroke-width="3.5"/></svg><span data-k="lg4" contenteditable="true">보고 · 결재</span></span>
    <span class="lg"><span class="swatch"></span><span data-k="lg5" contenteditable="true">실무협의체 (핵심 4객체)</span></span>
  </div>
</div>

<!-- ===================== 하단 속성바 ===================== -->
<div class="bar propbar" id="propbar">
  <span class="pb-hint" id="pbHint">객체를 클릭하면 <b>도형·크기</b>를, 화살표를 클릭하면 <b>방향·선 모양·곡률</b>을 바꿀 수 있습니다.</span>

  <!-- 객체 속성 -->
  <div class="pb-sec" id="pbNode" hidden>
    <span class="pb-title" id="pbNodeName">객체</span>
    <span class="tb-label">도형</span>
    <div class="tb-group" id="shapeBtns"></div>
    <div class="tb-sep"></div>
    <span class="tb-label">크기</span>
    <button class="tb-btn icon" onclick="resizeNode(-20,0)">폭﹣</button>
    <button class="tb-btn icon" onclick="resizeNode(20,0)">폭﹢</button>
    <button class="tb-btn icon" onclick="resizeNode(0,-12)">높이﹣</button>
    <button class="tb-btn icon" onclick="resizeNode(0,12)">높이﹢</button>
  </div>

  <!-- 화살표 속성 -->
  <div class="pb-sec" id="pbEdge" hidden>
    <span class="pb-title" id="pbEdgeName">화살표</span>
    <span class="tb-label">방향</span>
    <div class="tb-group" id="dirBtns"></div>
    <div class="tb-sep"></div>
    <span class="tb-label">연결면</span>
    <div class="tb-group" id="sideBtns"></div>
    <div class="tb-sep"></div>
    <span class="tb-label">선</span>
    <div class="tb-group" id="lineBtns"></div>
    <div class="tb-sep"></div>
    <span class="tb-label">굵기</span>
    <button class="tb-btn icon" onclick="bumpEdgeWidth(-0.5)">﹣</button>
    <span class="tb-label" id="ewVal">–</span>
    <button class="tb-btn icon" onclick="bumpEdgeWidth(0.5)">﹢</button>
    <div class="tb-sep"></div>
    <span class="tb-label">색</span>
    <div class="tb-group" id="colorBtns"></div>
    <div class="tb-sep"></div>
    <div class="tb-group">
      <span class="tb-label">곡률</span>
      <input type="range" id="bendRange" min="-140" max="140" step="4" value="0" oninput="setBend(this.value)">
      <button class="tb-btn icon" onclick="setBend(0); document.getElementById('bendRange').value=0;" title="곡률 초기화">0</button>
      <div class="tb-sep"></div>
      <button class="tb-btn danger" onclick="deleteEdge()">🗑 삭제</button>
    </div>
  </div>
</div>

<!--
  핵심 규칙 — 화면에는 표시하지 않고 데이터로만 보관합니다.
  콘솔에서 CORE_RULES 로 확인할 수 있습니다.
-->
<script type="application/json" id="core-rules">
[
  "주무관 2명은 교육청·대학교 양측 실무부서와 직접 소통하며 사업을 수행한다.",
  "교육협력관은 교육청 전 직급(교육감·국과장·실무부서) 및 대학교 상위 직급(총장·본부보직교수)과 모두 소통한다.",
  "교육감·국과장은 교육협력과와 소통한다.",
  "총장은 교육협력과와 교육협력관만 만날 수 있다. (교육감과 직접 소통 불가)",
  "총장이 교육청을 만날 때는 교육협력과가 주무부서로서 중개(마중물) 역할을 수행한다.",
  "보고·결재는 주무관(2명) → 교육협력관 → 교육협력과 순으로 이루어진다.",
  "실무협의체 = 4객체 — ① 실무부서(교육청) ② 교육협력과 ③ 교육협력관 + 주무관 2명(한 덩어리) ④ 본부·보직교수.",
  "교육지원청·직속기관·고등학교는 교육협력관/주무관 하위 체계이며 서로 동급이고, 학교는 교육지원청 하위에 위치한다."
]
</script>

  { id:'n-uniw',  row:'3', col:'r', x:1008,y:376, w:300, h:108, pal:'uni', shape:'round', t:'실무부서 (대학교)', fs:21, ds:14 },

  { id:'s-1',   row:'s',  col:'s1', x:308, y:524, w:220, h:56, pal:'sub', shape:'round', t:'교육지원청', fs:19, ds:12 },
  { id:'s-2',   row:'s',  col:'s2', x:608, y:524, w:220, h:56, pal:'sub', shape:'round', t:'직속기관',   fs:19, ds:12 },
  { id:'s-3',   row:'s',  col:'s3', x:908, y:524, w:220, h:56, pal:'sub', shape:'round', t:'고등학교',   fs:19, ds:12 },

/* ============================================================
   화살표
   dir  : both(양방향) / fwd(정방향) / back(역방향) / none(없음)
   route: curve(곡선) / ortho(직각)
   side : auto(자동) / h(가로) / v(세로) — 선이 어느 면에서 나갈지
   bend : 곡률 (-140 ~ 140)
   ============================================================ */
const KIND = {
  peer:   { color:'#64748b', w:3,   dash:'',    dir:'both', route:'curve', side:'auto' },
  hub:    { color:'#16a34a', w:2.5, dash:'7 5', dir:'both', route:'curve', side:'auto' },
  gate:   { color:'#1d4ed8', w:2.5, dash:'7 5', dir:'both', route:'curve', side:'auto' },
  report: { color:'#7c3aed', w:3.5, dash:'',    dir:'fwd',  route:'curve', side:'v'    },
  tree:   { color:'#94a3b8', w:3,   dash:'',    dir:'fwd',  route:'ortho', side:'v'    },
};
const DEFAULT_EDGES = [
  { id:'e1',  a:'n-gam',  b:'n-gwa',   k:'peer' },
  { id:'e2',  a:'n-gwa',  b:'n-chong', k:'peer' },
  { id:'e3',  a:'n-kuk',  b:'n-gwan',  k:'peer' },
  { id:'e4',  a:'n-gwan', b:'n-boj',   k:'peer' },
  { id:'e5',  a:'n-eduw', b:'n-mu',    k:'peer' },
  { id:'e6',  a:'n-mu',   b:'n-uniw',  k:'peer' },
  { id:'e7',  a:'n-gwan', b:'n-gam',   k:'hub' },
  { id:'e8',  a:'n-gwan', b:'n-eduw',  k:'hub' },
  { id:'e9',  a:'n-gwan', b:'n-chong', k:'hub' },
  { id:'e10', a:'n-gwa',  b:'n-kuk',   k:'gate' },
  { id:'e11', a:'n-mu',   b:'n-gwan',  k:'report', label:'보고 · 결재' },
  { id:'e12', a:'n-gwan', b:'n-gwa',   k:'report', label:'보고 · 결재' },
  { id:'e13', a:'n-mu',   b:'s-1',     k:'tree' },
  { id:'e14', a:'n-mu',   b:'s-2',     k:'tree' },
  { id:'e15', a:'n-mu',   b:'s-3',     k:'tree' },
  { id:'e16', a:'s-1',    b:'s-sch',   k:'tree' },
];
const EDGE_COLORS = ['#64748b','#16a34a','#1d4ed8','#7c3aed','#e11d48','#ea580c','#0f172a'];

const COUNCIL_GROUP = ['n-gwan','n-mu'];
const STORE_KEY = 'edu-uni-diagram-v4';
const SNAP = 8, GAP = 4, SVGNS = 'http://www.w3.org/2000/svg';

let nodes = [], edges = [];
let selNode = null, selEdge = null;
let editMode = false, linking = false, linkFrom = null;

const canvas   = document.getElementById('canvas');
const edgesG   = document.getElementById('edges');
const defs     = document.getElementById('defs');
const groupEl  = document.getElementById('councilGroup');
const guideH   = document.getElementById('guideH');
const guideV   = document.getElementById('guideV');
const statusEl = document.getElementById('status');

const byId  = id => nodes.find(n => n.id === id);
const edgeById = id => edges.find(e => e.id === id);
const clone = o => JSON.parse(JSON.stringify(o));
const svgEl = (tag, attrs) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if (attrs[k] !== '' && attrs[k] != null) e.setAttribute(k, attrs[k]);
  return e;
};

/* ============================ 초기화 ============================ */
const staticTexts = () => document.querySelectorAll('[data-k]');
let DEFAULT_TEXTS = {};

function init() {
  staticTexts().forEach(el => DEFAULT_TEXTS[el.dataset.k] = el.innerHTML);
  nodes = clone(DEFAULT_NODES);
  edges = clone(DEFAULT_EDGES).map(materializeEdge);

  const saved = localStorage.getItem(STORE_KEY);
  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (data.nodes) nodes.forEach(n => { if (data.nodes[n.id]) Object.assign(n, data.nodes[n.id]); });
      if (Array.isArray(data.edges) && data.edges.length) edges = data.edges.map(materializeEdge);
      if (data.texts) staticTexts().forEach(el => {
        if (data.texts[el.dataset.k] != null) el.innerHTML = data.texts[el.dataset.k];
      });
    } catch (e) { /* 저장본이 깨졌으면 기본값 사용 */ }
  }
  staticTexts().forEach(el => el.addEventListener('blur', persist));

  buildShapeButtons();
  buildEdgeButtons();
  buildNodes();
  layout();
  flash(HINT);
}

/* 화살표에 기본값을 채워 넣어 이후에는 개별 속성만 다루도록 한다 */
function materializeEdge(e) {
  const d = KIND[e.k] || KIND.peer;
  return {
    id: e.id, a: e.a, b: e.b, k: e.k, label: e.label || '',
    color: e.color ?? d.color, w: e.w ?? d.w, dash: e.dash ?? d.dash,
    dir: e.dir ?? d.dir, route: e.route ?? d.route, side: e.side ?? d.side ?? 'auto', bend: e.bend ?? 0,
  };
}

function buildNodes() {
  canvas.querySelectorAll('.nd').forEach(el => el.remove());
  nodes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'nd';
    el.dataset.id = n.id;
    el.innerHTML =
      `<svg class="shape"></svg>` +
      `<div class="nd-body">` +
        (n.badges || []).map(b => `<span class="badge ${b.p}" contenteditable="false">${b.x}</span>`).join('') +
        `<div class="n-title" data-f="t">${n.t}</div>` +
        `<div class="n-desc" data-f="d">${n.d || ''}</div>` +
      `</div>`;
    attachInteractions(el, n);
    canvas.appendChild(el);
  });
  if (editMode) canvas.querySelectorAll('[data-f]').forEach(f => f.setAttribute('contenteditable','true'));
}

/* ============================ 도형 그리기 ============================ */
function shapePath(shape, w, h, i) {
  const W = w - i, H = h - i;
  switch (shape) {
    case 'diamond': return `M${w/2},${i} L${W},${h/2} L${w/2},${H} L${i},${h/2} Z`;
    case 'hex': {
      const c = Math.min(30, w * 0.16);
      return `M${i + c},${i} L${W - c},${i} L${W},${h/2} L${W - c},${H} L${i + c},${H} L${i},${h/2} Z`;
    }
    default: return '';
  }
}

function drawShape(n, el) {
  const svg = el.querySelector('.shape');
  svg.setAttribute('viewBox', `0 0 ${n.w} ${n.h}`);
  svg.setAttribute('width', n.w);
  svg.setAttribute('height', n.h);
  svg.innerHTML = '';

  const pal = PALETTE[n.pal] || PALETTE.sub;
  const fill   = n.council ? COUNCIL.fill   : pal.fill;
  const stroke = n.council ? COUNCIL.stroke : pal.stroke;
  const sw     = n.council ? COUNCIL.w : 2;
  const dash   = n.council ? COUNCIL.dash : '';
  const i      = sw / 2;
  const common = { fill, stroke, 'stroke-width': sw, 'stroke-dasharray': dash };

  let node;
  if (n.shape === 'ellipse') {
    node = svgEl('ellipse', { cx:n.w/2, cy:n.h/2, rx:n.w/2 - i, ry:n.h/2 - i, ...common });
  } else if (n.shape === 'diamond' || n.shape === 'hex') {
    node = svgEl('path', { d: shapePath(n.shape, n.w, n.h, i), 'stroke-linejoin':'round', ...common });
  } else {
    const rx = n.shape === 'rect' ? 0 : n.shape === 'pill' ? (n.h - sw) / 2 : 14;
    node = svgEl('rect', { x:i, y:i, width:n.w - sw, height:n.h - sw, rx, ry:rx, ...common });
  }
  svg.appendChild(node);

  // 급(위계) 라벨의 왼쪽 강조 막대 — 사각 계열에서만
  if (n.accent && (n.shape === 'round' || n.shape === 'rect')) {
    svg.appendChild(svgEl('rect', {
      x:i, y:i + 2, width:5, height:n.h - sw - 4,
      rx: n.shape === 'rect' ? 0 : 3, fill:n.accent
    }));
  }

  const body = el.querySelector('.nd-body');
  body.style.color = n.council ? COUNCIL.text : pal.text;
  body.style.padding = SHAPE_PAD[n.shape] || SHAPE_PAD.round;
}

/* ============================ 레이아웃 ============================ */
function layout() {
  nodes.forEach(n => {
    const el = canvas.querySelector(`.nd[data-id="${n.id}"]`);
    if (!el) return;
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    el.style.width = n.w + 'px'; el.style.height = n.h + 'px';
    el.querySelector('.n-title').style.fontSize = n.fs + 'px';
    el.querySelector('.n-desc').style.fontSize = n.ds + 'px';
    drawShape(n, el);
  });
  drawEdges();
  drawGroup();
}

const rect = n => ({ x:n.x, y:n.y, w:n.w, h:n.h, cx:n.x + n.w/2, cy:n.y + n.h/2 });

/* 두 노드의 상대 위치에 따라 맞닿는 면을 자동 선택 */
function anchors(A, B, side) {
  const dx = B.cx - A.cx, dy = B.cy - A.cy;
  const horiz = side === 'h' ? true : side === 'v' ? false : Math.abs(dx) >= Math.abs(dy);
  if (horiz) {
    const s = dx >= 0 ? 1 : -1;
    return { p1:{ x:A.cx + s*(A.w/2 + GAP), y:A.cy }, p2:{ x:B.cx - s*(B.w/2 + GAP), y:B.cy }, dir:'h' };
  }
  const s = dy >= 0 ? 1 : -1;
  return { p1:{ x:A.cx, y:A.cy + s*(A.h/2 + GAP) }, p2:{ x:B.cx, y:B.cy - s*(B.h/2 + GAP) }, dir:'v' };
}

function edgeGeom(ed) {
  const A = byId(ed.a), B = byId(ed.b);
  if (!A || !B) return null;
  const { p1, p2, dir } = anchors(rect(A), rect(B), ed.side);

  if (ed.route === 'ortho') {
    const d = dir === 'v'
      ? `M${p1.x},${p1.y} V${(p1.y + p2.y)/2} H${p2.x} V${p2.y}`
      : `M${p1.x},${p1.y} H${(p1.x + p2.x)/2} V${p2.y} H${p2.x}`;
    return { d, mid:{ x:(p1.x + p2.x)/2, y:(p1.y + p2.y)/2 }, dir };
  }

  let c1, c2;
  if (dir === 'h') { const m = (p1.x + p2.x)/2; c1 = { x:m, y:p1.y }; c2 = { x:m, y:p2.y }; }
  else             { const m = (p1.y + p2.y)/2; c1 = { x:p1.x, y:m }; c2 = { x:p2.x, y:m }; }

  const bend = ed.bend || 0;
  if (bend) {
    const vx = p2.x - p1.x, vy = p2.y - p1.y, len = Math.hypot(vx, vy) || 1;
    const nx = -vy/len, ny = vx/len;
    c1 = { x:c1.x + nx*bend, y:c1.y + ny*bend };
    c2 = { x:c2.x + nx*bend, y:c2.y + ny*bend };
  }
  const mid = {
    x: (p1.x + 3*c1.x + 3*c2.x + p2.x) / 8,
    y: (p1.y + 3*c1.y + 3*c2.y + p2.y) / 8,
  };
  return { d:`M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`, mid, dir };
}

const markerCache = new Set();
function markerFor(color) {
  const id = 'ar-' + color.replace('#','');
  if (!markerCache.has(id)) {
    const m = svgEl('marker', { id, viewBox:'0 0 10 10', refX:9, refY:5,
      markerWidth:6, markerHeight:6, orient:'auto-start-reverse' });
    m.appendChild(svgEl('path', { d:'M0,0 L10,5 L0,10 z', fill:color }));
    defs.appendChild(m);
    markerCache.add(id);
  }
  return `url(#${id})`;
}

function drawEdges() {
  edgesG.innerHTML = '';
  edges.forEach(ed => {
    const g = edgeGeom(ed);
    if (!g) return;
    const mk = markerFor(ed.color);

    if (ed.id === selEdge) {
      edgesG.appendChild(svgEl('path', {
        d:g.d, fill:'none', stroke:'#3b82f6', 'stroke-width':Number(ed.w) + 9,
        'stroke-opacity':0.28, 'stroke-linecap':'round'
      }));
    }
    edgesG.appendChild(svgEl('path', {
      d:g.d, fill:'none', stroke:ed.color, 'stroke-width':ed.w, 'stroke-dasharray':ed.dash,
      'marker-start': (ed.dir === 'both' || ed.dir === 'back') ? mk : '',
      'marker-end':   (ed.dir === 'both' || ed.dir === 'fwd')  ? mk : ''
    }));
    // 클릭 판정용(보이지 않는 굵은 선)
    const hit = svgEl('path', { class:'hit', d:g.d, fill:'none', stroke:'transparent', 'stroke-width':16 });
    hit.dataset.eid = ed.id;
    hit.addEventListener('pointerdown', ev => { ev.stopPropagation(); selectEdge(ed.id); });
    edgesG.appendChild(hit);

    if (ed.label) {
      const t = svgEl('text', {
        x:g.mid.x + (g.dir === 'v' ? 14 : 0),
        y:g.mid.y + (g.dir === 'h' ? -9 : -6),
        'text-anchor': g.dir === 'v' ? 'start' : 'middle',
        'font-size':12, 'font-weight':800, fill:ed.color,
        'font-family':'Pretendard, sans-serif',
        stroke:'#ffffff', 'stroke-width':5, 'stroke-linejoin':'round', 'paint-order':'stroke fill'
      });
      t.textContent = ed.label;
      edgesG.appendChild(t);
    }
  });
}

function drawGroup() {
  const rs = COUNCIL_GROUP.map(id => byId(id)).filter(Boolean).map(rect);
  if (!rs.length) { groupEl.hidden = true; return; }
  groupEl.hidden = false;
  const pad = 22;
  const x1 = Math.min(...rs.map(r => r.x)) - pad, y1 = Math.min(...rs.map(r => r.y)) - pad;
  const x2 = Math.max(...rs.map(r => r.x + r.w)) + pad, y2 = Math.max(...rs.map(r => r.y + r.h)) + pad;
  groupEl.style.left = x1 + 'px'; groupEl.style.top = y1 + 'px';
  groupEl.style.width = (x2 - x1) + 'px'; groupEl.style.height = (y2 - y1) + 'px';
}

/* ============================ 드래그 / 편집 ============================ */
function attachInteractions(el, n) {
  el.addEventListener('pointerdown', e => {
    if (linking) { e.stopPropagation(); pickLink(n.id); return; }
    if (editMode || e.target.isContentEditable || e.button !== 0) return;
    e.stopPropagation();
    selectNode(n.id);
    const start = { mx:e.clientX, my:e.clientY, x:n.x, y:n.y };
    let moved = false;

    const onMove = ev => {
      const dx = ev.clientX - start.mx, dy = ev.clientY - start.my;
      if (!moved) {
        if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;   // 클릭과 드래그 구분
        moved = true; el.classList.add('dragging');
      }
      let nx = start.x + dx, ny = start.y + dy;
      if (!ev.shiftKey) ({ nx, ny } = snap(n, nx, ny));
      n.x = Math.max(0, Math.min(canvas.clientWidth  - n.w, Math.round(nx)));
      n.y = Math.max(0, Math.min(canvas.clientHeight - n.h, Math.round(ny)));
      layout();
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      el.classList.remove('dragging'); hideGuides();
      if (moved) persist();
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });

  el.querySelectorAll('[data-f]').forEach(f => {
    f.addEventListener('dblclick', ev => { ev.stopPropagation(); beginEdit(n, f); });
  });
}

function beginEdit(n, f) {
  if (f.getAttribute('contenteditable') === 'true' && document.activeElement === f) return;
  f.setAttribute('contenteditable', 'true');
  f.focus();
  const r = document.createRange(); r.selectNodeContents(f);
  const sel = document.getSelection(); sel.removeAllRanges(); sel.addRange(r);

  const done = () => {
    f.removeEventListener('blur', done); f.removeEventListener('keydown', onKey);
    if (!editMode) f.removeAttribute('contenteditable');
    n[f.dataset.f] = f.innerHTML.trim();
    persist();
  };
  const onKey = ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); f.blur(); }
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); f.blur(); }
  };
  f.addEventListener('blur', done);
  f.addEventListener('keydown', onKey);
}

function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? '✅ 편집 완료' : '✏️ 텍스트 편집';
  btn.classList.toggle('primary', editMode);
  canvas.querySelectorAll('[data-f]').forEach(f => {
    if (editMode) f.setAttribute('contenteditable','true'); else f.removeAttribute('contenteditable');
  });
  if (editMode) { if (linking) toggleLinking(); clearSelection(); flash('텍스트 편집 모드 — 아무 글자나 클릭해 수정하세요 (객체 이동 잠금)'); }
  else { harvestTexts(); flash('편집 내용을 저장했습니다'); }
}

function harvestTexts() {
  nodes.forEach(n => {
    const el = canvas.querySelector(`.nd[data-id="${n.id}"]`);
    if (!el) return;
    n.t = el.querySelector('.n-title').innerHTML.trim();
    n.d = el.querySelector('.n-desc').innerHTML.trim();
  });
  layout(); persist();
}

/* ============================ 스냅 ============================ */
function snap(n, nx, ny) {
  let gx = null, gy = null;
  const cx = nx + n.w/2, cy = ny + n.h/2;
  for (const o of nodes) {
    if (o.id === n.id) continue;
    const r = rect(o);
    if (gy === null) {
      if (Math.abs(cy - r.cy) < SNAP)                 { ny = r.cy - n.h/2;  gy = r.cy; }
      else if (Math.abs(ny - r.y) < SNAP)             { ny = r.y;           gy = r.y; }
      else if (Math.abs(ny + n.h - (r.y+r.h)) < SNAP) { ny = r.y+r.h-n.h;   gy = r.y+r.h; }
    }
    if (gx === null) {
      if (Math.abs(cx - r.cx) < SNAP)                 { nx = r.cx - n.w/2;  gx = r.cx; }
      else if (Math.abs(nx - r.x) < SNAP)             { nx = r.x;           gx = r.x; }
      else if (Math.abs(nx + n.w - (r.x+r.w)) < SNAP) { nx = r.x+r.w-n.w;   gx = r.x+r.w; }
    }
  }
  showGuide(guideH, gy, 'top'); showGuide(guideV, gx, 'left');
  return { nx, ny };
}
function showGuide(el, v, prop) {
  if (v === null) { el.style.display = 'none'; return; }
  el.style.display = 'block'; el.style[prop] = v + 'px';
}
const hideGuides = () => { guideH.style.display = 'none'; guideV.style.display = 'none'; };

/* ============================ 선택 / 속성바 ============================ */
function selectNode(id) {
  selNode = id; selEdge = null;
  canvas.querySelectorAll('.nd').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
  refreshProps(); drawEdges();
  const n = byId(id);
  if (n) flash(`선택: ${plain(n.t)}  ·  Shift 를 누른 채 끌면 스냅 해제`);
}
function selectEdge(id) {
  selEdge = id; selNode = null;
  canvas.querySelectorAll('.nd').forEach(el => el.classList.remove('sel'));
  refreshProps(); drawEdges();
  const e = edgeById(id);
  if (e) flash(`선택한 화살표: ${plain(byId(e.a).t)} → ${plain(byId(e.b).t)}`);
}
function clearSelection() {
  selNode = selEdge = null;
  canvas.querySelectorAll('.nd').forEach(el => el.classList.remove('sel'));
  refreshProps(); drawEdges();
}
const plain = s => (s || '').replace(/<[^>]+>/g, ' ').trim();

canvas.addEventListener('pointerdown', e => { if (e.target === canvas || e.target.closest('svg.wires') === null) clearSelection(); });

function refreshProps() {
  const pn = document.getElementById('pbNode'), pe = document.getElementById('pbEdge');
  const hint = document.getElementById('pbHint');
  const n = byId(selNode), e = edgeById(selEdge);

  pn.hidden = !n; pe.hidden = !e; hint.hidden = !!(n || e);
  document.getElementById('fsVal').textContent = n ? n.fs + 'px' : '–';

  if (n) {
    document.getElementById('pbNodeName').textContent = plain(n.t);
    document.querySelectorAll('#shapeBtns .tb-btn').forEach(b => b.classList.toggle('on', b.dataset.shape === n.shape));
  }
  if (e) {
    document.getElementById('pbEdgeName').textContent = `${plain(byId(e.a).t)} → ${plain(byId(e.b).t)}`;
    document.querySelectorAll('#dirBtns .tb-btn').forEach(b => b.classList.toggle('on', b.dataset.dir === e.dir));
    document.querySelectorAll('#sideBtns .tb-btn').forEach(b => b.classList.toggle('on', b.dataset.side === e.side));
    document.querySelectorAll('#lineBtns .tb-btn').forEach(b => {
      if (b.dataset.dash != null) b.classList.toggle('on', (e.dash ? 'dash' : 'solid') === b.dataset.dash);
      if (b.dataset.route != null) b.classList.toggle('on', e.route === b.dataset.route);
    });
    document.querySelectorAll('#colorBtns .sw').forEach(b => b.classList.toggle('on', b.dataset.color === e.color));
    document.getElementById('ewVal').textContent = e.w + 'px';
    document.getElementById('bendRange').value = e.bend || 0;
    document.getElementById('bendRange').disabled = e.route === 'ortho';
  }
}

function buildShapeButtons() {
  const wrap = document.getElementById('shapeBtns');
  wrap.innerHTML = '';
  SHAPES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'tb-btn'; b.dataset.shape = s.id; b.textContent = s.name;
    b.onclick = () => setShape(s.id);
    wrap.appendChild(b);
  });
}
function buildEdgeButtons() {
  const dirs = [ ['both','⟷ 양방향'], ['fwd','→ 정방향'], ['back','← 역방향'], ['none','— 없음'] ];
  const dw = document.getElementById('dirBtns'); dw.innerHTML = '';
  dirs.forEach(([v, label]) => {
    const b = document.createElement('button');
    b.className = 'tb-btn'; b.dataset.dir = v; b.textContent = label;
    b.onclick = () => setEdgeProp('dir', v);
    dw.appendChild(b);
  });

  const sw = document.getElementById('sideBtns'); sw.innerHTML = '';
  [['auto','자동'], ['h','가로'], ['v','세로']].forEach(([v, label]) => {
    const b = document.createElement('button');
    b.className = 'tb-btn'; b.dataset.side = v; b.textContent = label;
    b.onclick = () => setEdgeProp('side', v);
    sw.appendChild(b);
  });

  const lw = document.getElementById('lineBtns'); lw.innerHTML = '';
  [['solid','실선',''], ['dash','점선','7 5']].forEach(([v, label, dash]) => {
    const b = document.createElement('button');
    b.className = 'tb-btn'; b.dataset.dash = v; b.textContent = label;
    b.onclick = () => setEdgeProp('dash', dash);
    lw.appendChild(b);
  });
  [['curve','곡선'], ['ortho','직각']].forEach(([v, label]) => {
    const b = document.createElement('button');
    b.className = 'tb-btn'; b.dataset.route = v; b.textContent = label;
    b.onclick = () => setEdgeProp('route', v);
    lw.appendChild(b);
  });

  const cw = document.getElementById('colorBtns'); cw.innerHTML = '';
  EDGE_COLORS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'sw'; b.dataset.color = c; b.style.background = c;
    b.onclick = () => setEdgeProp('color', c);
    cw.appendChild(b);
  });
}

/* ============================ 도형 · 크기 ============================ */
function setShape(shape) {
  const n = byId(selNode);
  if (!n) return flash('먼저 객체를 클릭해 선택하세요');
  n.shape = shape;
  layout(); persist(); refreshProps();
}
function resizeNode(dw, dh) {
  const n = byId(selNode);
  if (!n) return flash('먼저 객체를 클릭해 선택하세요');
  n.w = Math.max(80,  Math.min(canvas.clientWidth  - n.x, n.w + dw));
  n.h = Math.max(40,  Math.min(canvas.clientHeight - n.y, n.h + dh));
  layout(); persist();
}

/* ============================ 화살표 조정 ============================ */
function setEdgeProp(key, val) {
  const e = edgeById(selEdge);
  if (!e) return flash('먼저 화살표를 클릭해 선택하세요');
  e[key] = val;
  if (key === 'route' && val === 'ortho') e.bend = 0;
  layout(); persist(); refreshProps();
}
function bumpEdgeWidth(d) {
  const e = edgeById(selEdge);
  if (!e) return flash('먼저 화살표를 클릭해 선택하세요');
  e.w = Math.round(Math.max(1, Math.min(10, e.w + d)) * 10) / 10;
  layout(); persist(); refreshProps();
}
function setBend(v) {
  const e = edgeById(selEdge);
  if (!e) return;
  e.bend = Number(v); e.route = 'curve';
  layout(); persist();
}
function deleteEdge() {
  const e = edgeById(selEdge);
  if (!e) return flash('먼저 화살표를 클릭해 선택하세요');
  edges = edges.filter(x => x.id !== e.id);
  selEdge = null; layout(); persist(); refreshProps();
  flash('화살표를 삭제했습니다');
}

/* 연결선 추가 — 객체 두 개를 차례로 클릭 */
function toggleLinking() {
  linking = !linking; linkFrom = null;
  document.body.classList.toggle('linking', linking);
  const b = document.getElementById('linkBtn');
  b.classList.toggle('on', linking);
  b.textContent = linking ? '✖ 연결 취소' : '🔗 연결선 추가';
  if (linking) { if (editMode) toggleEditMode(); clearSelection(); flash('시작 객체를 클릭하세요'); }
  else flash(HINT);
}
function pickLink(id) {
  if (!linkFrom) { linkFrom = id; flash(`시작: ${plain(byId(id).t)}  ·  이제 도착 객체를 클릭하세요`); return; }
  if (linkFrom === id) { flash('같은 객체입니다. 다른 객체를 클릭하세요'); return; }
  const ne = materializeEdge({ id:'e' + Date.now().toString(36), a:linkFrom, b:id, k:'peer' });
  edges.push(ne);
  linkFrom = null;
  toggleLinking();
  layout(); persist(); selectEdge(ne.id);
  flash('화살표를 추가했습니다 — 아래에서 방향과 선 모양을 바꿀 수 있습니다');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && linking) toggleLinking();
  if ((e.key === 'Delete' || e.key === 'Backspace') && selEdge && !document.activeElement.isContentEditable) {
    e.preventDefault(); deleteEdge();
  }
});

/* ============================ 정렬 ============================ */
function groupBy(key) {
  const m = {};
  nodes.forEach(n => (m[n[key]] = m[n[key]] || []).push(n));
  return m;
}
function alignRows() {
  Object.values(groupBy('row')).forEach(g => {
    if (g.length < 2) return;
    const cy = g.reduce((s,n) => s + n.y + n.h/2, 0) / g.length;
    g.forEach(n => n.y = Math.round(cy - n.h/2));
  });
  layout(); persist(); flash('동급 수평 정렬 완료');
}
function alignCols() {
  Object.values(groupBy('col')).forEach(g => {
    if (g.length < 2) return;
    const cx = g.reduce((s,n) => s + n.x + n.w/2, 0) / g.length;
    g.forEach(n => n.x = Math.round(cx - n.w/2));
  });
  layout(); persist(); flash('축 수직 정렬 완료');
}
function distributeRows() {
  const rows = Object.entries(groupBy('row'))
    .map(([k, g]) => ({ g, top:Math.min(...g.map(n=>n.y)), bot:Math.max(...g.map(n=>n.y+n.h)) }))
    .sort((a,b) => a.top - b.top);
  if (rows.length < 3) return;
  const first = rows[0], last = rows[rows.length-1];
  const totalH = rows.reduce((s,r) => s + (r.bot - r.top), 0);
  const gap = (last.bot - first.top - totalH) / (rows.length - 1);
  let y = first.top;
  rows.forEach(r => {
    const dy = Math.round(y - r.top);
    r.g.forEach(n => n.y += dy);
    y += (r.bot - r.top) + gap;
  });
  layout(); persist(); flash('행 간격 균등 배분 완료');
}

/* ============================ 폰트 ============================ */
function bumpFont(which, delta) {
  const n = byId(selNode);
  if (!n) return flash('먼저 객체를 클릭해 선택하세요');
  if (which === 'title') n.fs = Math.max(9, Math.min(44, n.fs + delta));
  else                   n.ds = Math.max(8, Math.min(30, n.ds + delta));
  layout(); persist(); refreshProps();
}
function bumpAllFont(delta) {
  nodes.forEach(n => {
    n.fs = Math.max(9, Math.min(44, n.fs + delta));
    n.ds = Math.max(8, Math.min(30, n.ds + delta));
  });
  layout(); persist(); refreshProps();
}

/* ============================ 저장 / 복원 ============================ */
function persist() {
  const data = { nodes:{}, texts:{}, edges };
  nodes.forEach(n => data.nodes[n.id] = {
    x:n.x, y:n.y, w:n.w, h:n.h, fs:n.fs, ds:n.ds, t:n.t, d:n.d, shape:n.shape
  });
  staticTexts().forEach(el => data.texts[el.dataset.k] = el.innerHTML);
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}
function resetLayout() {
  if (!confirm('배치 · 도형 · 화살표 · 글자를 모두 초기 상태로 되돌립니다. 계속할까요?')) return;
  localStorage.removeItem(STORE_KEY);
  nodes = clone(DEFAULT_NODES);
  edges = clone(DEFAULT_EDGES).map(materializeEdge);
  staticTexts().forEach(el => { if (DEFAULT_TEXTS[el.dataset.k] != null) el.innerHTML = DEFAULT_TEXTS[el.dataset.k]; });
  buildNodes(); clearSelection(); layout();
  flash('초기 상태로 복원했습니다');
}

const HINT = '객체·화살표를 클릭하면 아래에서 모양을 바꿀 수 있습니다 · 글자는 더블클릭';
let flashTimer;
function flash(msg) {
  statusEl.textContent = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { statusEl.textContent = HINT; }, 2800);
}

/* ============================ 이미지 저장 ============================ */
function saveAsImage() {
  if (typeof html2canvas === 'undefined') {
    flash('이미지 저장 기능을 불러오지 못했습니다 — 인터넷 연결 후 새로고침하세요');
    return;
  }
  const slide = document.getElementById('slide-container');
  if (editMode) toggleEditMode();
  if (linking) toggleLinking();
  if (document.activeElement) document.activeElement.blur();
  clearSelection(); hideGuides();
  flash('캡처 중…');
  html2canvas(slide, { scale:2, useCORS:true, backgroundColor:'#ffffff' }).then(cv => {
    const link = document.createElement('a');
    link.download = '교육청_대학교_협력체계_도식.png';
    link.href = cv.toDataURL('image/png');
    link.click();
    flash('이미지를 저장했습니다');
  });
}

const CORE_RULES = JSON.parse(document.getElementById('core-rules').textContent);
window.CORE_RULES = CORE_RULES;

init();
</script>
