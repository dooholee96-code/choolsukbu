<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육청-대학교 협력 체계 도식 (편집 가능)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  :root {
    --slate: #64748b;
    --rose: #e11d48;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background-color: #e2e8f0;
    margin: 0;
    padding: 78px 40px 60px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  /* ================= 툴바 ================= */
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0;
    height: 58px;
    background: #0f172a;
    display: flex; align-items: center; gap: 10px;
    padding: 0 18px;
    z-index: 2000;
    box-shadow: 0 3px 12px rgba(0,0,0,0.25);
    overflow-x: auto;
  }
  .tb-group { display: flex; align-items: center; gap: 6px; }
  .tb-sep { width: 1px; height: 26px; background: #334155; margin: 0 6px; flex-shrink: 0; }
  .tb-label { color: #94a3b8; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .tb-btn {
    background: #1e293b; color: #e2e8f0;
    border: 1px solid #334155; border-radius: 8px;
    padding: 8px 13px; font-size: 13px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    font-family: inherit;
  }
  .tb-btn:hover { background: #334155; }
  .tb-btn:active { transform: translateY(1px); }
  .tb-btn.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  .tb-btn.primary:hover { background: #2563eb; }
  .tb-btn.icon { padding: 8px 12px; font-size: 15px; min-width: 38px; }
  .tb-btn:disabled { opacity: .4; cursor: not-allowed; }
  .tb-status { color: #64748b; font-size: 12px; font-weight: 600; margin-left: auto; white-space: nowrap; padding-left: 12px; }

  /* ================= 슬라이드 ================= */
  .presentation-slide {
    background: #fff;
    width: 1440px;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,.1);
    padding: 32px 60px 28px;
    position: relative;
    display: flex; flex-direction: column;
  }
  .title { text-align:center; font-size:34px; font-weight:800; color:#1e293b; margin:0 0 4px; letter-spacing:-1px; }
  .subtitle { text-align:center; font-size:15px; font-weight:600; color:#64748b; margin:0 0 16px; }

  .canvas {
    position: relative;
    width: 1320px; height: 700px;
    flex-shrink: 0;
    touch-action: none;
  }
  svg.wires {
    position:absolute; inset:0; width:100%; height:100%;
    z-index: 2; pointer-events: none; overflow: visible;
  }

  /* ================= 노드 ================= */
  .nd {
    position: absolute;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; line-height: 1.35;
    border-radius: 14px;
    border: 2px solid transparent;
    padding: 6px 12px;
    z-index: 3;
    cursor: grab;
    user-select: none;
    box-shadow: 0 4px 8px rgba(0,0,0,.06);
    transition: box-shadow .15s;
  }
  .nd.dragging { cursor: grabbing; z-index: 50; box-shadow: 0 12px 26px rgba(0,0,0,.22); }
  .nd.sel { outline: 3px solid #3b82f6; outline-offset: 3px; }
  .nd .n-title { font-weight: 800; letter-spacing: -0.4px; }
  .nd .n-desc  { font-weight: 600; opacity: .9; margin-top: 5px; }
  .nd .n-desc:empty { display: none; }
  [contenteditable="true"] { cursor: text; user-select: text; }
  [contenteditable="true"]:focus {
    outline: 2px solid #3b82f6; border-radius: 4px;
    background: rgba(255,255,255,.9);
  }

  /* ===== 텍스트 편집 모드 ===== */
  body.edit-mode .nd { cursor: text; }
  body.edit-mode .nd [data-f] { outline: 1px dashed rgba(59,130,246,.55); outline-offset: 2px; border-radius: 4px; }
  body.edit-mode .nd .n-desc:empty {
    display: block; min-width: 90px; min-height: 1.2em;
    outline: 1px dashed rgba(59,130,246,.55);
  }
  body.edit-mode .nd .n-desc:empty::before { content: '설명 입력'; color: #94a3b8; font-size: 11px; }
  body.edit-mode .guide { display: none !important; }

  .header { color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.12); }
  .bg-edu { background:#2563eb; }
  .bg-hub { background:#16a34a; }
  .bg-uni { background:#ea580c; }

  .edu-node { background:#eff6ff; color:#1e40af; border-color:#bfdbfe; }
  .hub-node { background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
  .uni-node { background:#fff7ed; color:#9a3412; border-color:#fed7aa; }
  .sub-node { background:#f8fafc; color:#475569; border-color:#cbd5e1; }

  .tier { background:#f1f5f9; border-left:5px solid #94a3b8; border-radius:8px; }
  .tier .n-title { color:#334155; }
  .tier .n-desc  { color:#64748b; }
  .tier-1 { border-left-color:#2563eb; }
  .tier-2 { border-left-color:#16a34a; }
  .tier-3 { border-left-color:#ea580c; }
  .tier-x { border-left-color:#94a3b8; }

  /* 실무협의체 강조 */
  .council { background:#fff1f2 !important; border:3px dashed var(--rose) !important; color:#9f1239 !important; }
  .badge {
    position:absolute; top:-14px;
    color:#fff; font-size:12.5px; font-weight:800;
    padding:5px 12px; border-radius:20px;
    letter-spacing:-0.5px; white-space:nowrap;
    z-index: 4; pointer-events:none;
  }
  .badge.r { right:-10px; background:var(--rose); box-shadow:0 4px 8px rgba(225,29,72,.4); }
  .badge.l { left:-10px;  background:#0891b2; box-shadow:0 4px 8px rgba(8,145,178,.35); }

  /* 실무협의체 ③ 그룹 (교육협력관 + 주무관 2명 = 1객체) */
  #councilGroup {
    position:absolute; z-index:1;
    background: rgba(255,241,242,.85);
    border: 3px dashed var(--rose);
    border-radius: 18px;
  }
  #councilGroup .badge { top:-15px; left:-6px; right:auto; background:var(--rose); box-shadow:0 4px 8px rgba(225,29,72,.4); }

  /* 정렬 가이드 */
  .guide { position:absolute; background:#f43f5e; z-index:60; pointer-events:none; display:none; }
  .guide.h { left:0; width:100%; height:1px; }
  .guide.v { top:0; height:100%; width:1px; }

  .peer-note { position:absolute; z-index:3; font-size:13px; font-weight:700; color:#64748b; }

  /* ================= 범례 (간략) ================= */
  .legend-bar {
    display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; gap:10px 28px;
    margin-top:14px; padding:12px 18px;
    border-top:2px solid #e2e8f0;
  }
  .lg { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:#475569; }
  .swatch { display:inline-block; width:24px; height:14px; flex-shrink:0; background:#fff1f2; border:2px dashed var(--rose); border-radius:5px; }

</style>
</head>
<body>

<!-- ===================== 툴바 ===================== -->
<div class="toolbar">
  <span class="tb-label">정렬</span>
  <div class="tb-group">
    <button class="tb-btn" onclick="alignRows()" title="같은 급(행)의 객체들을 수평으로 맞춥니다">⇔ 동급 수평 정렬</button>
    <button class="tb-btn" onclick="alignCols()" title="같은 축(열)의 객체들을 수직으로 맞춥니다">⇕ 축 수직 정렬</button>
    <button class="tb-btn" onclick="distributeRows()" title="행 간격을 균등하게 맞춥니다">≡ 행 간격 균등</button>
  </div>
  <div class="tb-sep"></div>

  <span class="tb-label">선택 객체 폰트</span>
  <div class="tb-group">
    <button class="tb-btn icon" id="fsDown" onclick="bumpFont('title',-1)">가﹣</button>
    <span class="tb-label" id="fsVal">–</span>
    <button class="tb-btn icon" id="fsUp" onclick="bumpFont('title',1)">가﹢</button>
    <button class="tb-btn" onclick="bumpFont('desc',-1)">설명﹣</button>
    <button class="tb-btn" onclick="bumpFont('desc',1)">설명﹢</button>
  </div>
  <div class="tb-sep"></div>

  <span class="tb-label">전체 폰트</span>
  <div class="tb-group">
    <button class="tb-btn icon" onclick="bumpAllFont(-1)">﹣</button>
    <button class="tb-btn icon" onclick="bumpAllFont(1)">﹢</button>
  </div>
  <div class="tb-sep"></div>

  <div class="tb-group">
    <button class="tb-btn" id="editBtn" onclick="toggleEditMode()" title="모든 글자를 클릭해서 바로 고칠 수 있습니다 (이동 잠금)">✏️ 텍스트 편집</button>
    <button class="tb-btn" onclick="resetLayout()">↺ 초기 배치 복원</button>
    <button class="tb-btn primary" onclick="saveAsImage()">📸 PPT용 이미지 저장</button>
  </div>
  <span class="tb-status" id="status">객체를 끌어 이동 · 글자는 더블클릭하거나 ✏️ 텍스트 편집</span>
</div>

<!-- ===================== 슬라이드 ===================== -->
<div class="presentation-slide" id="slide-container">
  <h1 class="title" data-k="title" contenteditable="true">교육청-대학교 협력 체계 도식</h1>
  <p class="subtitle" data-k="subtitle" contenteditable="true">3개 축 · 3단 동급 편제 · 소통 채널 및 보고 · 결재 라인</p>

  <div class="canvas" id="canvas">
    <div class="guide h" id="guideH"></div>
    <div class="guide v" id="guideV"></div>

    <div id="councilGroup"><span class="badge" contenteditable="false">실무협의체 ③ (1객체)</span></div>

    <svg class="wires" id="wires" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="ar-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
        <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
        <marker id="ar-blue"  viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
        <marker id="ar-report" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
      </defs>
      <g id="edges"></g>
    </svg>

    <div class="peer-note" id="peerNote" data-k="peerNote" contenteditable="true" style="left:1152px; top:494px;">※ 3개 기관 서로 동급</div>
  </div>

  <!-- 범례 (간략) -->
  <div class="legend-bar">
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#64748b" stroke-width="3"/></svg><span data-k="lg1" contenteditable="true">동급 소통</span></span>
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/></svg><span data-k="lg2" contenteditable="true">교육협력관 소통</span></span>
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="6 4"/></svg><span data-k="lg3" contenteditable="true">교육협력과 소통</span></span>
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#7c3aed" stroke-width="3.5"/></svg><span data-k="lg4" contenteditable="true">보고 · 결재</span></span>
    <span class="lg"><span class="swatch"></span><span data-k="lg5" contenteditable="true">실무협의체 (핵심 4객체)</span></span>
  </div>
</div>

<!--
  핵심 규칙 — 화면에는 표시하지 않고 데이터로만 보관합니다.
  콘솔에서 CORE_RULES 로 확인할 수 있습니다.
-->
<script type="application/json" id="core-rules">
[
  "주무관 2명은 교육청·대학교 양측 실무부서와 직접 소통하며 사업을 수행한다.",
  "교육협력관은 교육청 전 직급(교육감·국과장·실무부서) 및 대학교 상위 직급(총장·본부보직교수)과 모두 소통한다.",
  "교육감·국과장은 교육협력과와 소통한다.",
  "총장은 교육협력과와 교육협력관만 만날 수 있다. (교육감과 직접 소통 불가)",
  "총장이 교육청을 만날 때는 교육협력과가 주무부서로서 중개(마중물) 역할을 수행한다.",
  "보고·결재는 주무관(2명) → 교육협력관 → 교육협력과 순으로 이루어진다.",
  "실무협의체 = 4객체 — ① 실무부서(교육청) ② 교육협력과 ③ 교육협력관 + 주무관 2명(한 덩어리) ④ 본부·보직교수.",
  "교육지원청·직속기관·고등학교는 교육협력관/주무관 하위 체계이며 서로 동급이고, 학교는 교육지원청 하위에 위치한다."
]
</script>

<script>
/* ============================================================
   데이터 모델
   row : 동급(수평 정렬 그룹)   col : 축(수직 정렬 그룹)
   ============================================================ */
const DEFAULT_NODES = [
  // 헤더

  // 1급

  { id:'n-boj',   row:'2', col:'r', x:1008,y:222, w:300, h:108, cls:'uni-node council', t:'본부 · 보직교수', fs:21, ds:14,

  { id:'n-uniw',  row:'3', col:'r', x:1008,y:376, w:300, h:108, cls:'uni-node',         t:'실무부서 (대학교)', fs:21, ds:14 },

/* 연결선 정의 — 노드를 옮기면 자동으로 다시 그려집니다 */
const EDGES = [
  // 동급 간 직접 소통

  { a:'n-gwa',  b:'n-chong', k:'peer' },

  { a:'n-gwan', b:'n-gwa',   k:'report', label:'보고 · 결재' },

  { a:'s-1',    b:'s-sch',   k:'tree' },

/* 하위 체계 분기 (1 : N 트리) */
const TREE = { from:'n-mu', to:['s-1','s-2','s-3'] };

const STYLE = {
  peer:   { stroke:'#64748b', w:3,   dash:'',     s:'url(#ar-slate)', e:'url(#ar-slate)' },
  hub:    { stroke:'#16a34a', w:2.5, dash:'7 5',  s:'url(#ar-green)', e:'url(#ar-green)' },
  gate:   { stroke:'#1d4ed8', w:2.5, dash:'7 5',  s:'url(#ar-blue)',  e:'url(#ar-blue)'  },
  report: { stroke:'#7c3aed', w:3.5, dash:'',     s:'',               e:'url(#ar-report)' },
  tree:   { stroke:'#94a3b8', w:3,   dash:'',     s:'',               e:'url(#ar-slate)' },
};

const COUNCIL_GROUP = ['n-gwan','n-mu'];
const STORE_KEY = 'edu-uni-diagram-v3';
const SNAP = 8, GAP = 4;
const SVGNS = 'http://www.w3.org/2000/svg';

let nodes = [];
let selected = null;

const canvas = document.getElementById('canvas');
const edgesG = document.getElementById('edges');
const groupEl = document.getElementById('councilGroup');
const guideH = document.getElementById('guideH');
const guideV = document.getElementById('guideV');
const statusEl = document.getElementById('status');

const byId = id => nodes.find(n => n.id === id);
const clone = o => JSON.parse(JSON.stringify(o));

/* ============================ 초기화 ============================ */
/* 슬라이드 안의 고정 텍스트(제목 · 부제 · 범례 등) */
const staticTexts = () => document.querySelectorAll('[data-k]');
let DEFAULT_TEXTS = {};

function init() {
  staticTexts().forEach(el => DEFAULT_TEXTS[el.dataset.k] = el.innerHTML);

  const saved = localStorage.getItem(STORE_KEY);
  nodes = clone(DEFAULT_NODES);
  if (saved) {
    try {
      const data = JSON.parse(saved);
      nodes.forEach(n => { if (data.nodes && data.nodes[n.id]) Object.assign(n, data.nodes[n.id]); });
      if (data.texts) staticTexts().forEach(el => {
        if (data.texts[el.dataset.k] != null) el.innerHTML = data.texts[el.dataset.k];
      });
    } catch (e) { /* 저장본이 깨졌으면 기본 배치 사용 */ }
  }
  // 고정 텍스트도 고치면 바로 저장
  staticTexts().forEach(el => el.addEventListener('blur', persist));

  buildNodes();
  layout();
}

function buildNodes() {
  canvas.querySelectorAll('.nd').forEach(el => el.remove());
  nodes.forEach(n => {
    const el = document.createElement('div');
    el.className = 'nd ' + n.cls;
    el.dataset.id = n.id;
    el.innerHTML =
      (n.badges || []).map(b => `<span class="badge ${b.p}" contenteditable="false">${b.x}</span>`).join('') +
      `<div class="n-title" data-f="t">${n.t}</div>` +
      `<div class="n-desc" data-f="d">${n.d || ''}</div>`;
    attachInteractions(el, n);
    canvas.appendChild(el);
  });
}

/* ============================ 렌더 ============================ */
function layout() {
  nodes.forEach(n => {
    const el = canvas.querySelector(`.nd[data-id="${n.id}"]`);
    if (!el) return;
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.style.width = n.w + 'px';
    el.style.height = n.h + 'px';
    el.querySelector('.n-title').style.fontSize = n.fs + 'px';
    el.querySelector('.n-desc').style.fontSize = n.ds + 'px';
  });
  drawEdges();
  drawGroup();
}

function rect(n) { return { x:n.x, y:n.y, w:n.w, h:n.h, cx:n.x + n.w/2, cy:n.y + n.h/2 }; }

/* 두 노드의 상대 위치에 따라 맞닿는 면을 자동 선택 */
function anchors(A, B) {
  const dx = B.cx - A.cx, dy = B.cy - A.cy;
  if (Math.abs(dx) >= Math.abs(dy)) {              // 좌우 연결
    const s = dx >= 0 ? 1 : -1;
    return {
      p1: { x: A.cx + s * (A.w/2 + GAP), y: A.cy },
      p2: { x: B.cx - s * (B.w/2 + GAP), y: B.cy },
      dir: 'h'
    };
  }
  const s = dy >= 0 ? 1 : -1;                       // 상하 연결
  return {
    p1: { x: A.cx, y: A.cy + s * (A.h/2 + GAP) },
    p2: { x: B.cx, y: B.cy - s * (B.h/2 + GAP) },
    dir: 'v'
  };
}

function curve(p1, p2, dir) {
  if (dir === 'h') {
    const m = (p1.x + p2.x) / 2;
    return `M${p1.x},${p1.y} C${m},${p1.y} ${m},${p2.y} ${p2.x},${p2.y}`;
  }
  const m = (p1.y + p2.y) / 2;
  return `M${p1.x},${p1.y} C${p1.x},${m} ${p2.x},${m} ${p2.x},${p2.y}`;
}

function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if (attrs[k] !== '' && attrs[k] != null) e.setAttribute(k, attrs[k]);
  return e;
}

function drawEdges() {
  edgesG.innerHTML = '';

  EDGES.forEach(ed => {
    const A = rect(byId(ed.a)), B = rect(byId(ed.b));
    const { p1, p2, dir } = anchors(A, B);
    const st = STYLE[ed.k];
    edgesG.appendChild(svgEl('path', {
      d: curve(p1, p2, dir), fill: 'none',
      stroke: st.stroke, 'stroke-width': st.w, 'stroke-dasharray': st.dash,
      'marker-start': st.s, 'marker-end': st.e
    }));
    if (ed.label) {
      const t = svgEl('text', {
        x: (p1.x + p2.x)/2 + (dir === 'v' ? 14 : 0),
        y: (p1.y + p2.y)/2 + (dir === 'h' ? -9 : -6),
        'text-anchor': dir === 'v' ? 'start' : 'middle',
        'font-size': 12, 'font-weight': 800, fill: st.stroke,
        'font-family': 'Pretendard, sans-serif',
        stroke: '#ffffff', 'stroke-width': 5, 'stroke-linejoin': 'round',
        'paint-order': 'stroke fill'
      });
      t.textContent = ed.label;
      edgesG.appendChild(t);
    }
  });

  // 하위 체계 분기 (트리)
  const src = rect(byId(TREE.from));
  const tg = TREE.to.map(id => rect(byId(id)));
  const topY = Math.min(...tg.map(t => t.y));
  const midY = (src.y + src.h + topY) / 2;
  const st = STYLE.tree;
  const line = d => edgesG.appendChild(svgEl('path', { d, fill:'none', stroke:st.stroke, 'stroke-width':st.w }));
  line(`M${src.cx},${src.y + src.h + GAP} V${midY}`);
  line(`M${Math.min(...tg.map(t=>t.cx))},${midY} H${Math.max(...tg.map(t=>t.cx))}`);
  tg.forEach(t => edgesG.appendChild(svgEl('path', {
    d: `M${t.cx},${midY} V${t.y - GAP}`, fill:'none',
    stroke: st.stroke, 'stroke-width': st.w, 'marker-end': st.e
  })));
}

function drawGroup() {
  const rs = COUNCIL_GROUP.map(id => rect(byId(id)));
  const pad = 22;
  const x1 = Math.min(...rs.map(r => r.x)) - pad;
  const y1 = Math.min(...rs.map(r => r.y)) - pad;
  const x2 = Math.max(...rs.map(r => r.x + r.w)) + pad;
  const y2 = Math.max(...rs.map(r => r.y + r.h)) + pad;
  groupEl.style.left = x1 + 'px';
  groupEl.style.top = y1 + 'px';
  groupEl.style.width = (x2 - x1) + 'px';
  groupEl.style.height = (y2 - y1) + 'px';
}

/* ============================ 드래그 / 선택 / 편집 ============================ */
function attachInteractions(el, n) {
  // 드래그 — pointer capture 대신 window 리스너를 쓴다.
  // (capture 를 걸면 click/dblclick 대상이 노드로 바뀌어 글자 편집이 막힌다)
  el.addEventListener('pointerdown', e => {
    if (editMode || e.target.isContentEditable || e.button !== 0) return;
    select(n.id);
    const start = { mx:e.clientX, my:e.clientY, x:n.x, y:n.y };
    let moved = false;

    const onMove = ev => {
      const dx = ev.clientX - start.mx, dy = ev.clientY - start.my;
      if (!moved) {
        if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;   // 클릭과 드래그를 구분하는 여유값
        moved = true;
        el.classList.add('dragging');
      }
      let nx = start.x + dx, ny = start.y + dy;
      if (!ev.shiftKey) ({ nx, ny } = snap(n, nx, ny));
      n.x = Math.max(0, Math.min(canvas.clientWidth  - n.w, Math.round(nx)));
      n.y = Math.max(0, Math.min(canvas.clientHeight - n.h, Math.round(ny)));
      layout();
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      el.classList.remove('dragging');
      hideGuides();
      if (moved) persist();
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });

  // 더블클릭 → 해당 글자만 바로 수정
  el.querySelectorAll('[data-f]').forEach(f => {
    f.addEventListener('dblclick', ev => { ev.stopPropagation(); beginEdit(n, f); });
  });
}

/* 한 칸 편집 시작 */
function beginEdit(n, f) {
  if (f.getAttribute('contenteditable') === 'true' && document.activeElement === f) return;
  f.setAttribute('contenteditable', 'true');
  f.focus();
  const r = document.createRange(); r.selectNodeContents(f);
  const sel = document.getSelection(); sel.removeAllRanges(); sel.addRange(r);

  const done = () => {
    f.removeEventListener('blur', done);
    f.removeEventListener('keydown', onKey);
    if (!editMode) f.removeAttribute('contenteditable');
    n[f.dataset.f] = f.innerHTML.trim();
    persist();
  };
  const onKey = ev => {
    if (ev.key === 'Escape') { ev.preventDefault(); f.blur(); }
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); f.blur(); }  // Shift+Enter 는 줄바꿈
  };
  f.addEventListener('blur', done);
  f.addEventListener('keydown', onKey);
}

/* 텍스트 편집 모드 — 모든 글자를 클릭 한 번으로 수정 (이동 잠금) */
let editMode = false;
function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? '✅ 편집 완료' : '✏️ 텍스트 편집';
  btn.classList.toggle('primary', editMode);

  canvas.querySelectorAll('[data-f]').forEach(f => {
    if (editMode) f.setAttribute('contenteditable', 'true');
    else f.removeAttribute('contenteditable');
  });
  if (editMode) { select(null); flash('텍스트 편집 모드 — 아무 글자나 클릭해 수정하세요 (객체 이동 잠금)'); }
  else { harvestTexts(); flash('편집 내용을 저장했습니다'); }
}

/* 화면의 글자를 데이터 모델로 회수 */
function harvestTexts() {
  nodes.forEach(n => {
    const el = canvas.querySelector(`.nd[data-id="${n.id}"]`);
    if (!el) return;
    n.t = el.querySelector('.n-title').innerHTML.trim();
    n.d = el.querySelector('.n-desc').innerHTML.trim();
  });
  layout(); persist();
}

/* 정렬 스냅 — 다른 객체의 중심 / 위 / 아래 모서리에 자동으로 맞춤 */
function snap(n, nx, ny) {
  let gx = null, gy = null;
  const cx = nx + n.w/2, cy = ny + n.h/2;
  for (const o of nodes) {
    if (o.id === n.id) continue;
    const r = rect(o);
    if (gy === null) {
      if (Math.abs(cy - r.cy) < SNAP)               { ny = r.cy - n.h/2; gy = r.cy; }
      else if (Math.abs(ny - r.y) < SNAP)           { ny = r.y;          gy = r.y; }
      else if (Math.abs(ny + n.h - (r.y+r.h)) < SNAP){ ny = r.y+r.h-n.h; gy = r.y+r.h; }
    }
    if (gx === null) {
      if (Math.abs(cx - r.cx) < SNAP)               { nx = r.cx - n.w/2; gx = r.cx; }
      else if (Math.abs(nx - r.x) < SNAP)           { nx = r.x;          gx = r.x; }
      else if (Math.abs(nx + n.w - (r.x+r.w)) < SNAP){ nx = r.x+r.w-n.w; gx = r.x+r.w; }
    }
  }
  showGuide(guideH, gy, 'top');
  showGuide(guideV, gx, 'left');
  return { nx, ny };
}
function showGuide(el, v, prop) {
  if (v === null) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.style[prop] = v + 'px';
}
function hideGuides() { guideH.style.display = 'none'; guideV.style.display = 'none'; }

function select(id) {
  selected = id;
  canvas.querySelectorAll('.nd').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
  const n = byId(id);
  document.getElementById('fsVal').textContent = n ? n.fs + 'px' : '–';
  statusEl.textContent = n ? `선택: ${n.t.replace(/<[^>]+>/g,' ')}  ·  Shift를 누른 채 끌면 스냅 해제` : HINT;
}
canvas.addEventListener('pointerdown', e => {
  if (e.target === canvas) { selected = null; canvas.querySelectorAll('.nd').forEach(el=>el.classList.remove('sel')); document.getElementById('fsVal').textContent='–'; }
});

/* ============================ 정렬 명령 ============================ */
function groupBy(key) {
  const m = {};
  nodes.forEach(n => (m[n[key]] = m[n[key]] || []).push(n));
  return m;
}
function alignRows() {                       // 동급(행) 수평 정렬 — 중심선을 맞춤
  Object.values(groupBy('row')).forEach(g => {
    if (g.length < 2) return;
    const cy = g.reduce((s,n) => s + n.y + n.h/2, 0) / g.length;
    g.forEach(n => n.y = Math.round(cy - n.h/2));
  });
  layout(); persist(); flash('동급 수평 정렬 완료');
}
function alignCols() {                       // 축(열) 수직 정렬 — 중심선을 맞춤
  Object.values(groupBy('col')).forEach(g => {
    if (g.length < 2) return;
    const cx = g.reduce((s,n) => s + n.x + n.w/2, 0) / g.length;
    g.forEach(n => n.x = Math.round(cx - n.w/2));
  });
  layout(); persist(); flash('축 수직 정렬 완료');
}
function distributeRows() {                  // 행 간 세로 간격 균등
  const rows = Object.entries(groupBy('row'))
    .map(([k, g]) => ({ k, g, top: Math.min(...g.map(n=>n.y)), bot: Math.max(...g.map(n=>n.y+n.h)) }))
    .sort((a,b) => a.top - b.top);
  if (rows.length < 3) return;
  const first = rows[0], last = rows[rows.length-1];
  const totalH = rows.reduce((s,r) => s + (r.bot - r.top), 0);
  const gap = (last.bot - first.top - totalH) / (rows.length - 1);
  let y = first.top;
  rows.forEach(r => {
    const dy = Math.round(y - r.top);
    r.g.forEach(n => n.y += dy);
    y += (r.bot - r.top) + gap;
  });
  layout(); persist(); flash('행 간격 균등 배분 완료');
}

/* ============================ 폰트 ============================ */
function bumpFont(which, delta) {
  const n = byId(selected);
  if (!n) return flash('먼저 객체를 클릭해 선택하세요');
  if (which === 'title') n.fs = Math.max(9, Math.min(44, n.fs + delta));
  else                   n.ds = Math.max(8, Math.min(30, n.ds + delta));
  document.getElementById('fsVal').textContent = n.fs + 'px';
  layout(); persist();
}
function bumpAllFont(delta) {
  nodes.forEach(n => {
    n.fs = Math.max(9,  Math.min(44, n.fs + delta));
    n.ds = Math.max(8,  Math.min(30, n.ds + delta));
  });
  const n = byId(selected);
  if (n) document.getElementById('fsVal').textContent = n.fs + 'px';
  layout(); persist();
}

/* ============================ 저장 / 복원 ============================ */
function persist() {
  const data = { nodes: {}, texts: {} };
  nodes.forEach(n => data.nodes[n.id] = { x:n.x, y:n.y, w:n.w, h:n.h, fs:n.fs, ds:n.ds, t:n.t, d:n.d });
  staticTexts().forEach(el => data.texts[el.dataset.k] = el.innerHTML);
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
}
function resetLayout() {
  if (!confirm('배치 · 글자 · 폰트 크기를 모두 초기 상태로 되돌립니다. 계속할까요?')) return;
  localStorage.removeItem(STORE_KEY);
  nodes = clone(DEFAULT_NODES);
  staticTexts().forEach(el => { if (DEFAULT_TEXTS[el.dataset.k] != null) el.innerHTML = DEFAULT_TEXTS[el.dataset.k]; });
  buildNodes(); layout(); select(null);
  flash('초기 배치로 복원했습니다');
}
const HINT = '객체를 끌어 이동 · 글자는 더블클릭하거나 ✏️ 텍스트 편집';
let flashTimer;
function flash(msg) {
  statusEl.textContent = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { statusEl.textContent = HINT; }, 2600);
}

/* ============================ 이미지 저장 ============================ */
function saveAsImage() {
  const slide = document.getElementById('slide-container');
  const prevSel = selected;
  if (editMode) toggleEditMode();          // 편집 테두리가 이미지에 찍히지 않도록
  if (document.activeElement) document.activeElement.blur();
  select(null);
  hideGuides();
  flash('캡처 중…');
  html2canvas(slide, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(cv => {
    const link = document.createElement('a');
    link.download = '교육청_대학교_협력체계_도식.png';
    link.href = cv.toDataURL('image/png');
    link.click();
    if (prevSel) select(prevSel);
    flash('이미지를 저장했습니다');
  });
}

const CORE_RULES = JSON.parse(document.getElementById('core-rules').textContent);
window.CORE_RULES = CORE_RULES;

init();
</script>
</body>
</html>
