<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교육청-대학교 협력 체계 도식 (편집 가능)</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  :root {
    --ui:      #5b7fa6;   /* 선택·강조용 UI 색 */
    --bar:     #2b3340;
    --bar2:    #222933;
    --line:    #3a4452;
    --txt:     #dfe4ea;
    --muted:   #8d97a4;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    background-color: #e8eaed;
    margin: 0; padding: 78px 40px 104px;
    display: flex; justify-content: center; align-items: flex-start;
  }

  /* ================= 툴바 / 속성바 ================= */
  .bar {
    position: fixed; left: 0; right: 0;
    display: flex; align-items: center; gap: 9px;
    padding: 0 18px; z-index: 2000; overflow-x: auto;
  }
  .toolbar { top: 0; height: 58px; background: var(--bar); box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  .propbar { bottom: 0; min-height: 84px; background: var(--bar2); box-shadow: 0 -2px 10px rgba(0,0,0,.18); flex-wrap: wrap; padding: 10px 18px; }

  .tb-group { display: flex; align-items: center; gap: 5px; }
  .tb-sep { width: 1px; height: 24px; background: var(--line); margin: 0 5px; flex-shrink: 0; }
  .tb-label { color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .tb-btn {
    background: #39424f; color: var(--txt);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 7px 12px; font-size: 13px; font-weight: 700;
    cursor: pointer; white-space: nowrap; font-family: inherit;
  }
  .tb-btn:hover { background: #46515f; }
  .tb-btn:active { transform: translateY(1px); }
  .tb-btn.primary { background: #4a6480; border-color: #56728f; color: #fff; }
  .tb-btn.on { background: var(--ui); border-color: #7a9dc0; color: #fff; }
  .tb-btn.danger { background: #5e3a41; border-color: #7d4c55; color: #f0d4d9; }
  .tb-btn.icon { padding: 7px 11px; min-width: 36px; }
  .tb-status { color: var(--muted); font-size: 12px; font-weight: 600; margin-left: auto; padding-left: 12px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  .pb-hint { color: var(--muted); font-size: 13px; font-weight: 600; }
  .pb-sec { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  [hidden] { display: none !important; }
  .pb-title { color: #eef1f5; font-size: 13px; font-weight: 800; margin-right: 4px; white-space: nowrap; }
  .sw { width: 25px; height: 25px; border-radius: 6px; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .sw.on { border-color: #fff; }
  input[type=range] { width: 120px; accent-color: var(--ui); }
  .pick { width: 32px; height: 27px; padding: 0; border: 2px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }

  /* ================= 슬라이드 ================= */
  .presentation-slide {
    background: #fff; width: 1440px;
    border-radius: 14px; box-shadow: 0 14px 36px rgba(0,0,0,.10);
    padding: 30px 60px 26px; position: relative;
    display: flex; flex-direction: column;
  }
  .title { text-align:center; font-size:32px; font-weight:800; color:#39424f; margin:0 0 4px; letter-spacing:-1px; min-height:1em; }
  .subtitle { text-align:center; font-size:15px; font-weight:600; color:#7b8593; margin:0 0 14px; min-height:1em; }

  .canvas { position: relative; width: 1320px; height: 600px; flex-shrink: 0; touch-action: none; }
  svg.wires { position:absolute; inset:0; width:100%; height:100%; z-index:200; pointer-events:none; overflow:visible; }
  svg.wires .hit { pointer-events: stroke; cursor: pointer; }

  /* ================= 객체 ================= */
  .nd { position: absolute; cursor: grab; user-select: none; }
  .nd .shape { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .nd-body {
    position: relative; z-index: 1; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    line-height: 1.32; word-break: keep-all; overflow-wrap: anywhere;
  }
  .nd-body .n-text { width: 100%; font-weight: 800; letter-spacing: -0.4px; }
  .nd.dragging { cursor: grabbing; }
  .nd.sel::after {
    content:''; position:absolute; inset:-5px;
    border: 2px solid var(--ui); border-radius: 8px; pointer-events: none;
  }

  [contenteditable="true"] { cursor: text; user-select: text; }
  [contenteditable="true"]:focus { outline: 2px solid var(--ui); border-radius: 4px; background: rgba(255,255,255,.92); }

  body.edit-mode .nd { cursor: text; }
  body.edit-mode .nd .n-text { outline: 1px dashed rgba(91,127,166,.5); outline-offset: 2px; border-radius: 4px; }
  body.edit-mode .guide, body.edit-mode .handles { display: none !important; }

  /* 연결부(포트) */
  .ports { position:absolute; inset:-9px; z-index:5; display:none; }
  .ports i {
    position:absolute; width:13px; height:13px; margin:-6.5px 0 0 -6.5px;
    background:#fff; border:2px solid var(--ui); border-radius:50%; cursor:crosshair;
  }
  .ports i:hover { background:var(--ui); transform:scale(1.25); }
  .ports i[data-port=t]{ left:50%; top:0 } .ports i[data-port=b]{ left:50%; top:100% }
  .ports i[data-port=l]{ left:0; top:50% }  .ports i[data-port=r]{ left:100%; top:50% }
  body.linking .nd { cursor: crosshair; }
  body.linking .nd:hover .ports, .nd.linksrc .ports { display:block; }

  .badge {
    position:absolute; top:-13px;
    color:#fff; font-size:12px; font-weight:800;
    padding:4px 11px; border-radius:20px;
    letter-spacing:-0.5px; white-space:nowrap; z-index:4;
  }
  .badge.r { right:-8px; background:#94636f; }
  .badge.l { left:-8px;  background:#5a7480; }

  /* 크기 조절 손잡이 */
  .handles { position:absolute; z-index:300; pointer-events:none; }
  .hnd {
    position:absolute; width:11px; height:11px; margin:-5.5px 0 0 -5.5px;
    background:#fff; border:2px solid var(--ui); border-radius:2px; pointer-events:auto;
  }
  .hnd[data-h=nw]{left:0;top:0;cursor:nwse-resize} .hnd[data-h=n]{left:50%;top:0;cursor:ns-resize}
  .hnd[data-h=ne]{left:100%;top:0;cursor:nesw-resize} .hnd[data-h=e]{left:100%;top:50%;cursor:ew-resize}
  .hnd[data-h=se]{left:100%;top:100%;cursor:nwse-resize} .hnd[data-h=s]{left:50%;top:100%;cursor:ns-resize}
  .hnd[data-h=sw]{left:0;top:100%;cursor:nesw-resize} .hnd[data-h=w]{left:0;top:50%;cursor:ew-resize}

  .guide { position:absolute; background:#a98b93; z-index:400; pointer-events:none; display:none; }
  .guide.h { left:0; width:100%; height:1px; }
  .guide.v { top:0; height:100%; width:1px; }
  .marquee {
    position:absolute; z-index:350; display:none; pointer-events:none;
    border:1px solid var(--ui); background:rgba(91,127,166,.12);
  }

  /* ================= 범례 ================= */
  .legend-bar {
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:10px 26px; margin-top:12px; padding:11px 18px; border-top:1px solid #dfe3e8;
  }
  .lg { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:#5d6773; }
  .swatch { display:inline-block; width:24px; height:14px; flex-shrink:0; background:#f4ecee; border:2px dashed #a8697a; border-radius:4px; }
</style>
</head>
<body>

<!-- ===================== 툴바 ===================== -->
<div class="bar toolbar">
  <div class="tb-group">
    <button class="tb-btn primary" onclick="addNode()" title="빈 곳을 더블클릭해도 새 글상자가 생깁니다">＋ 객체 추가</button>
    <button class="tb-btn" onclick="duplicateSel()" title="Ctrl+D">⧉ 복제</button>
    <button class="tb-btn danger" onclick="deleteSel()" title="Delete">🗑 삭제</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="tb-btn" id="linkBtn" onclick="toggleLinking()" title="시작 객체(또는 연결부)와 도착 객체를 차례로 클릭">🔗 연결선</button>
    <button class="tb-btn" id="editBtn" onclick="toggleEditMode()" title="모든 글자를 클릭 한 번으로 수정 (이동 잠금)">✏️ 텍스트 편집</button>
    <button class="tb-btn on" id="snapBtn" onclick="toggleSnap()" title="다른 객체에 맞춰 자동 정렬 (Alt 로 일시 해제)">🧲 스냅</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="tb-btn primary" onclick="exportHTML()"
            title="지금 화면 그대로가 담긴 HTML 파일을 내려받습니다. 그 파일을 열면 이어서 편집할 수 있습니다">💾 파일로 저장</button>
    <label class="tb-btn" title="저장해 둔 HTML 또는 데이터 파일을 불러옵니다">⤒ 불러오기
      <input type="file" accept=".html,.htm,.json" hidden onchange="importFile(event)">
    </label>
    <button class="tb-btn" onclick="exportJSON()" title="배치 데이터만 .json 으로 내려받습니다">⤓ 데이터</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button class="tb-btn" onclick="resetLayout()">↺ 초기 상태로</button>
    <button class="tb-btn primary" onclick="saveAsImage()">📸 이미지</button>
  </div>
  <span class="tb-status" id="status"></span>
</div>

<!-- ===================== 슬라이드 ===================== -->
<div class="presentation-slide" id="slide-container">
  <h1 class="title" data-k="title" contenteditable="true"></h1>
  <p class="subtitle" data-k="subtitle" contenteditable="true"></p>

  <div class="canvas" id="canvas">
    <div class="guide h" id="guideH"></div>
    <div class="guide v" id="guideV"></div>
    <div class="marquee" id="marquee"></div>
    <svg class="wires" id="wires" xmlns="http://www.w3.org/2000/svg">
      <defs id="defs"></defs>
      <g id="edges"></g>
    </svg>
    <div class="handles" id="handles" hidden></div>
  </div>

  <div class="legend-bar">
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#8b95a1" stroke-width="3"/></svg><span data-k="lg1" contenteditable="true">동급 소통</span></span>
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#5f7a66" stroke-width="3" stroke-dasharray="6 4"/></svg><span data-k="lg2" contenteditable="true">교육협력관 소통</span></span>
    <span class="lg"><svg width="30" height="10"><line x1="1" y1="5" x2="29" y2="5" stroke="#6f6383" stroke-width="3.5"/></svg><span data-k="lg3" contenteditable="true">보고 · 결재</span></span>
    <span class="lg"><span class="swatch"></span><span data-k="lg4" contenteditable="true">실무협의체 (핵심 4객체)</span></span>
  </div>
</div>

<!-- ===================== 속성바 ===================== -->
<div class="bar propbar" id="propbar">
  <span class="pb-hint" id="pbHint">객체를 클릭하면 <b>도형·색·글자</b>를, 화살표를 클릭하면 <b>연결부·방향·선</b>을 바꿀 수 있습니다. 빈 곳을 끌면 여러 개를 한 번에 선택합니다.</span>

  <!-- 객체 -->
  <div class="pb-sec" id="pbNode" hidden>
    <span class="pb-title" id="pbNodeName">객체</span>
    <span class="tb-label">도형</span><div class="tb-group" id="shapeBtns"></div>
    <div class="tb-sep"></div>
    <span class="tb-label">색</span><div class="tb-group" id="themeBtns"></div>
    <input type="color" class="pick" id="nodeColor" title="색 직접 고르기"
           oninput="setCustomFill(this.value)">
    <button class="tb-btn" id="emphBtn" onclick="toggleEmph()" title="점선 테두리로 강조">강조</button>
    <div class="tb-sep"></div>
    <span class="tb-label">글자</span>
    <button class="tb-btn icon" onclick="bumpFont(-1)">가﹣</button>
    <span class="tb-label" id="fsVal">–</span>
    <button class="tb-btn icon" onclick="bumpFont(1)">가﹢</button>
    <div class="tb-group" id="taBtns"></div>
    <div class="tb-group" id="vaBtns"></div>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="zOrder(1)">앞으로</button>
    <button class="tb-btn" onclick="zOrder(-1)">뒤로</button>
    <button class="tb-btn" onclick="addBadge()">＋배지</button>
  </div>

  <!-- 여러 개 선택 -->
  <div class="pb-sec" id="pbMulti" hidden>
    <span class="pb-title" id="pbMultiName">객체 여러 개</span>
    <span class="tb-label">정렬</span>
    <div class="tb-group" id="alignBtns"></div>
    <div class="tb-sep"></div>
    <span class="tb-label">배분</span>
    <button class="tb-btn" onclick="distribute('h')">가로 균등</button>
    <button class="tb-btn" onclick="distribute('v')">세로 균등</button>
    <div class="tb-sep"></div>
    <span class="tb-label">크기 맞춤</span>
    <button class="tb-btn" onclick="matchSize('w')">같은 폭</button>
    <button class="tb-btn" onclick="matchSize('h')">같은 높이</button>
    <div class="tb-sep"></div>
    <button class="tb-btn primary" onclick="treeConnect()"
            title="가장 위(또는 아래)의 객체를 부모로 삼아, 나머지를 가운데에서 갈라지는 트리로 연결합니다">⑂ 트리 연결</button>
    <div class="tb-sep"></div>
    <span class="tb-label">색</span><div class="tb-group" id="themeBtns2"></div>
  </div>

  <!-- 화살표 -->
  <div class="pb-sec" id="pbEdge" hidden>
    <span class="pb-title" id="pbEdgeName">화살표</span>
    <span class="tb-label">시작 연결부</span><div class="tb-group" id="portA"></div>
    <span class="tb-label">끝</span><div class="tb-group" id="portB"></div>
    <button class="tb-btn" onclick="swapEnds()" title="시작과 끝을 맞바꿉니다">⇄ 뒤집기</button>
    <div class="tb-sep"></div>
    <span class="tb-label">방향</span><div class="tb-group" id="dirBtns"></div>
    <div class="tb-sep"></div>
    <span class="tb-label">선</span><div class="tb-group" id="lineBtns"></div>
    <div class="tb-sep"></div>
    <span class="tb-label">굵기</span>
    <button class="tb-btn icon" onclick="bumpEdgeWidth(-0.5)">﹣</button>
    <span class="tb-label" id="ewVal">–</span>
    <button class="tb-btn icon" onclick="bumpEdgeWidth(0.5)">﹢</button>
    <div class="tb-sep"></div>
    <span class="tb-label">색</span><div class="tb-group" id="colorBtns"></div>
    <input type="color" class="pick" id="edgeColor" title="색 직접 고르기"
           oninput="setEdgeProp('color', this.value)">
    <div class="tb-sep"></div>
    <div class="tb-group">
      <span class="tb-label">곡률</span>
      <input type="range" id="bendRange" min="-140" max="140" step="4" value="0" oninput="setBend(this.value)">
      <button class="tb-btn icon" onclick="setBend(0)" title="곡률 초기화">0</button>
      <button class="tb-btn danger" onclick="deleteSel()">🗑 삭제</button>
    </div>
  </div>
</div>

<!--
  '💾 파일로 저장' 을 누르면 그 시점의 배치·글자·화살표가 아래 칸에 담긴 채로
  HTML 이 통째로 내려받아집니다. 그 파일을 열면 저장한 상태에서 이어서 편집합니다.
-->
<script type="application/json" id="saved-state"></script>

<!--
  핵심 규칙 — 화면에는 표시하지 않고 데이터로만 보관합니다. (콘솔: CORE_RULES)
-->
<script type="application/json" id="core-rules">
[
  "주무관 2명은 교육청·대학교 양측 실무부서와 직접 소통하며 사업을 수행한다.",
  "교육협력관은 교육청 전 직급(교육감·국과장·실무부서) 및 대학교 상위 직급(총장·본부보직교수)과 모두 소통한다.",
  "교육감·국과장은 교육협력과와 소통한다.",
  "총장은 교육협력과와 교육협력관만 만날 수 있다. (교육감과 직접 소통 불가)",
  "총장이 교육청을 만날 때는 교육협력과가 주무부서로서 중개(마중물) 역할을 수행한다.",
  "보고·결재는 주무관(2명) → 교육협력관 → 교육협력과 순으로 이루어진다.",
  "실무협의체 = 4객체 — ① 실무부서(교육청) ② 교육협력과 ③ 교육협력관 + 주무관 2명(한 덩어리) ④ 본부·보직교수.",
  "교육지원청·직속기관·고등학교는 교육협력관/주무관 하위 체계이며 서로 동급이고, 학교는 교육지원청 하위에 위치한다."
]
</script>

<script>
/* ============================================================
   톤다운 팔레트
   ============================================================ */
const THEMES = {
  none:   { name:'투명',   fill:'none',    stroke:'none',    text:'#39424f' },
  plain:  { name:'흰색',   fill:'#ffffff', stroke:'#d3d8df', text:'#3c4451' },
  gray:   { name:'회색',   fill:'#f2f4f6', stroke:'#c6cdd6', text:'#39424f' },
  blue:   { name:'청회',   fill:'#eaeff4', stroke:'#b0c1d1', text:'#34506b' },
  sage:   { name:'세이지', fill:'#ecf0eb', stroke:'#b4c5b5', text:'#3e5643' },
  clay:   { name:'베이지', fill:'#f4efe8', stroke:'#d3c2ac', text:'#6a5340' },
  rose:   { name:'로즈',   fill:'#f4ecee', stroke:'#cdaab1', text:'#6b4048' },
  dkblue: { name:'남색',   fill:'#4a5d75', stroke:'#4a5d75', text:'#ffffff' },
  dksage: { name:'짙은녹', fill:'#4e6753', stroke:'#4e6753', text:'#ffffff' },
  dkclay: { name:'짙은갈', fill:'#7b6349', stroke:'#7b6349', text:'#ffffff' },
};
const EMPH = { stroke:'#a8697a', dash:'8 5', w:2.5 };

const SHAPES = [
  { id:'none',    name:'글상자' },
  { id:'round',   name:'▢ 둥근' },
  { id:'rect',    name:'▭ 사각' },
  { id:'pill',    name:'⬭ 캡슐' },
  { id:'ellipse', name:'◯ 타원' },
  { id:'diamond', name:'◇ 마름모' },
  { id:'hex',     name:'⬡ 육각' },
];
const SHAPE_PAD = { none:'4px 6px', round:'6px 12px', rect:'6px 12px', pill:'6px 22px', ellipse:'6px 12%', diamond:'6px 20%', hex:'6px 30px' };
const SMALL = '<span style="font-size:.72em;font-weight:600">';

/* ============================================================
   객체 — 자유 배치. 정렬은 여러 개 선택 후 속성바에서.
   ============================================================ */
const DEFAULT_NODES = [
  // 뒤 레이어
  { id:'grp', x:546, y:182, w:344, h:222, z:1, th:'rose', shape:'round', emph:true, va:'top',
    t:'실무협의체 ③ (1객체)', fs:13 },

/* 파일에 심어 둔 저장본. 저장한 HTML 마다 고유한 칸을 쓰므로,
   여러 파일을 오가며 편집해도 서로 섞이지 않는다. */
const SAVED = (() => {
  try {
    const t = document.getElementById('saved-state').textContent.trim();
    return t ? JSON.parse(t) : null;
  } catch (e) { return null; }
})();
const STORE_KEY = 'edu-uni-diagram-v5:' + ((SAVED && SAVED.docId) || 'default');
const SNAP = 8, GAP = 4, SVGNS = 'http://www.w3.org/2000/svg';
const PORTS = [['auto','자동'], ['t','▲'], ['r','▶'], ['b','▼'], ['l','◀']];
const OUT = { t:{x:0,y:-1}, r:{x:1,y:0}, b:{x:0,y:1}, l:{x:-1,y:0} };

let nodes = [], edges = [];
let sel = [];            // 선택된 객체 id 목록
let selEdge = null;
let editMode = false, linking = false, snapOn = true;
let linkFrom = null;     // { id, port }

const canvas   = document.getElementById('canvas');
const edgesG   = document.getElementById('edges');
const defs     = document.getElementById('defs');
const guideH   = document.getElementById('guideH');
const guideV   = document.getElementById('guideV');
const marquee  = document.getElementById('marquee');
const handlesEl= document.getElementById('handles');
const statusEl = document.getElementById('status');

const byId = id => nodes.find(n => n.id === id);
const edgeById = id => edges.find(e => e.id === id);
const clone = o => JSON.parse(JSON.stringify(o));
const plain = s => (s || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g,' ').trim() || '(빈 글상자)';
const uid = p => p + Math.random().toString(36).slice(2, 8);
const svgEl = (tag, attrs) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if (attrs[k] !== '' && attrs[k] != null) e.setAttribute(k, attrs[k]);
  return e;
};
const rect = n => ({ x:n.x, y:n.y, w:n.w, h:n.h, cx:n.x + n.w/2, cy:n.y + n.h/2 });

/* ============================ 초기화 ============================ */
const staticTexts = () => document.querySelectorAll('[data-k]');
let DEFAULT_TEXTS = {};

function init() {
  staticTexts().forEach(el => DEFAULT_TEXTS[el.dataset.k] = el.innerHTML);
  nodes = clone(DEFAULT_NODES).map(materializeNode);
  edges = clone(DEFAULT_EDGES).map(materializeEdge);

  // 이 파일에서 이어 편집하던 내용이 있으면 그것을, 없으면 파일에 심어 둔 저장본을 쓴다
  let data = null;
  try { data = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { /* 깨진 저장본 무시 */ }
  applyState(data || SAVED);

  staticTexts().forEach(el => el.addEventListener('blur', persist));

  buildPropButtons();
  buildNodes();
  layout();
  flash(HINT);
}
const materializeNode = n => Object.assign(
  { z:3, th:'plain', shape:'round', t:'', fs:20, ta:'center', va:'middle', emph:false, badges:[] }, n);
const materializeEdge = e => Object.assign({}, EDGE_DEF, e);

function buildNodes() {
  canvas.querySelectorAll('.nd').forEach(el => el.remove());
  nodes.forEach(n => canvas.appendChild(makeNodeEl(n)));
  if (editMode) canvas.querySelectorAll('.n-text').forEach(f => f.setAttribute('contenteditable','true'));
}

function makeNodeEl(n) {
  const el = document.createElement('div');
  el.className = 'nd';
  el.dataset.id = n.id;
  el.innerHTML =
    `<svg class="shape"></svg>` +
    `<div class="nd-body">` +
      (n.badges || []).map((b,i) => `<span class="badge ${b.p}" data-bi="${i}">${b.x}</span>`).join('') +
      `<div class="n-text">${n.t}</div>` +
    `</div>` +
    `<div class="ports"><i data-port="t"></i><i data-port="r"></i><i data-port="b"></i><i data-port="l"></i></div>`;
  attachInteractions(el, n);
  return el;
}

/* ============================ 도형 ============================ */
function shapePath(shape, w, h, i) {
  const W = w - i, H = h - i;
  if (shape === 'diamond') return `M${w/2},${i} L${W},${h/2} L${w/2},${H} L${i},${h/2} Z`;
  const c = Math.min(30, w * 0.16);
  return `M${i+c},${i} L${W-c},${i} L${W},${h/2} L${W-c},${H} L${i+c},${H} L${i},${h/2} Z`;
}

function drawShape(n, el) {
  const svg = el.querySelector('.shape');
  svg.setAttribute('viewBox', `0 0 ${n.w} ${n.h}`);
  svg.setAttribute('width', n.w); svg.setAttribute('height', n.h);
  svg.innerHTML = '';

  const th = n.custom || THEMES[n.th] || THEMES.plain;
  const bare = n.shape === 'none';
  if (!bare && th.fill !== 'none') {
    const stroke = n.emph ? EMPH.stroke : th.stroke;
    const sw = n.emph ? EMPH.w : 2;
    const dash = n.emph ? EMPH.dash : '';
    const i = sw / 2;
    const common = { fill:th.fill, stroke, 'stroke-width':sw, 'stroke-dasharray':dash };

    let s;
    if (n.shape === 'ellipse')      s = svgEl('ellipse', { cx:n.w/2, cy:n.h/2, rx:n.w/2-i, ry:n.h/2-i, ...common });
    else if (n.shape === 'diamond' || n.shape === 'hex')
                                    s = svgEl('path', { d:shapePath(n.shape, n.w, n.h, i), 'stroke-linejoin':'round', ...common });
    else {
      const rx = n.shape === 'rect' ? 0 : n.shape === 'pill' ? (n.h - sw)/2 : 12;
      s = svgEl('rect', { x:i, y:i, width:n.w-sw, height:n.h-sw, rx, ry:rx, ...common });
    }
    svg.appendChild(s);

    if (n.accent && (n.shape === 'round' || n.shape === 'rect')) {
      svg.appendChild(svgEl('rect', { x:i, y:i+2, width:5, height:n.h-sw-4,
        rx: n.shape === 'rect' ? 0 : 3, fill:n.accent }));
    }
  }

  const body = el.querySelector('.nd-body');
  body.style.color = bare ? THEMES.none.text : th.text;
  body.style.padding = SHAPE_PAD[n.shape] || SHAPE_PAD.round;
  body.style.justifyContent = n.va === 'top' ? 'flex-start' : n.va === 'bottom' ? 'flex-end' : 'center';
  body.querySelector('.n-text').style.textAlign = n.ta;
  body.querySelector('.n-text').style.fontSize = n.fs + 'px';
}

/* ============================ 레이아웃 ============================ */
function layout() {
  nodes.forEach(n => {
    const el = canvas.querySelector(`.nd[data-id="${n.id}"]`);
    if (!el) return;
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
    el.style.width = n.w + 'px'; el.style.height = n.h + 'px';
    el.style.zIndex = n.z;
    drawShape(n, el);
  });
  drawEdges();
  drawHandles();
}

/* ---- 연결부 ---- */
/* 자동 연결부 — 두 객체가 나란히 놓였는지 위아래로 놓였는지를 먼저 본다.
   (겹침을 무시하고 거리만 비교하면, 아래에 벌려 놓은 자식이 옆면에 붙는다) */
function autoPort(A, B) {
  const ox = Math.min(A.x + A.w, B.x + B.w) - Math.max(A.x, B.x);   // 가로로 겹치는 폭
  const oy = Math.min(A.y + A.h, B.y + B.h) - Math.max(A.y, B.y);   // 세로로 겹치는 높이
  const dx = B.cx - A.cx, dy = B.cy - A.cy;
  if (oy > 0 && ox <= 0) return dx >= 0 ? 'r' : 'l';                // 같은 줄 → 좌우
  if (ox > 0 && oy <= 0) return dy >= 0 ? 'b' : 't';                // 위아래 → 상하
  return Math.abs(dx) >= Math.abs(dy) ? (dx >= 0 ? 'r' : 'l') : (dy >= 0 ? 'b' : 't');
}
const resolvePorts = ed => {
  const A = byId(ed.a), B = byId(ed.b);
  if (!A || !B) return null;
  const ra = rect(A), rb = rect(B);
  return { ra, rb, pa: ed.pa === 'auto' ? autoPort(ra, rb) : ed.pa,
                   pb: ed.pb === 'auto' ? autoPort(rb, ra) : ed.pb };
};

/* 한 객체에서 여러 갈래로 내려가는 직각 연결선은 가로 줄기를 공유한다 */
function trunkLevels() {
  const groups = {};
  edges.forEach(ed => {
    if (ed.route !== 'ortho') return;
    const r = resolvePorts(ed);
    if (!r) return;
    if (!((r.pa === 'b' && r.pb === 't') || (r.pa === 't' && r.pb === 'b'))) return;
    const key = ed.a + '|' + r.pa;
    (groups[key] = groups[key] || []).push({ ed, ...r });
  });
  const out = {};
  Object.values(groups).forEach(list => {
    if (list.length < 2) return;                       // 형제가 있을 때만 줄기를 맞춘다
    const { ra, pa } = list[0];
    const edgeY = pa === 'b' ? ra.y + ra.h : ra.y;
    const kids  = list.map(({ rb }) => pa === 'b' ? rb.y : rb.y + rb.h);
    const lvl = (edgeY + (pa === 'b' ? Math.min(...kids) : Math.max(...kids))) / 2;
    list.forEach(({ ed }) => out[ed.id] = lvl);
  });
  return out;
}
function portPoint(r, port) {
  if (port === 't') return { x:r.cx, y:r.y - GAP };
  if (port === 'b') return { x:r.cx, y:r.y + r.h + GAP };
  if (port === 'l') return { x:r.x - GAP, y:r.cy };
  return { x:r.x + r.w + GAP, y:r.cy };
}

function edgeGeom(ed, trunkY) {
  const r = resolvePorts(ed);
  if (!r) return null;
  const { ra, rb, pa, pb } = r;
  const p1 = portPoint(ra, pa), p2 = portPoint(rb, pb);
  const vertA = pa === 't' || pa === 'b', vertB = pb === 't' || pb === 'b';

  if (ed.route === 'ortho') {
    let d;
    if (vertA && vertB)        d = `M${p1.x},${p1.y} V${trunkY ?? (p1.y+p2.y)/2} H${p2.x} V${p2.y}`;
    else if (!vertA && !vertB) d = `M${p1.x},${p1.y} H${(p1.x+p2.x)/2} V${p2.y} H${p2.x}`;
    else if (vertA)            d = `M${p1.x},${p1.y} V${p2.y} H${p2.x}`;
    else                       d = `M${p1.x},${p1.y} H${p2.x} V${p2.y}`;
    return { d, mid:{ x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2 }, vert:vertA };
  }

  const dist = Math.hypot(p2.x-p1.x, p2.y-p1.y);
  const k = Math.max(40, dist * 0.42);
  let c1 = { x:p1.x + OUT[pa].x*k, y:p1.y + OUT[pa].y*k };
  let c2 = { x:p2.x + OUT[pb].x*k, y:p2.y + OUT[pb].y*k };

  if (ed.bend) {
    const len = dist || 1, nx = -(p2.y-p1.y)/len, ny = (p2.x-p1.x)/len;
    c1 = { x:c1.x + nx*ed.bend, y:c1.y + ny*ed.bend };
    c2 = { x:c2.x + nx*ed.bend, y:c2.y + ny*ed.bend };
  }
  return {
    d: `M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`,
    mid: { x:(p1.x + 3*c1.x + 3*c2.x + p2.x)/8, y:(p1.y + 3*c1.y + 3*c2.y + p2.y)/8 },
    vert: vertA
  };
}

const markerCache = new Set();
function markerFor(color) {
  const id = 'ar-' + color.replace('#','');
  if (!markerCache.has(id)) {
    const m = svgEl('marker', { id, viewBox:'0 0 10 10', refX:9, refY:5,
      markerWidth:6, markerHeight:6, orient:'auto-start-reverse' });
    m.appendChild(svgEl('path', { d:'M0,0 L10,5 L0,10 z', fill:color }));
    defs.appendChild(m); markerCache.add(id);
  }
  return `url(#${id})`;
}

function drawEdges() {
  edgesG.innerHTML = '';
  const trunks = trunkLevels();
  edges.forEach(ed => {
    const g = edgeGeom(ed, trunks[ed.id]);
    if (!g) return;
    const mk = markerFor(ed.color);

    if (ed.id === selEdge) edgesG.appendChild(svgEl('path', {
      d:g.d, fill:'none', stroke:'#5b7fa6', 'stroke-width':Number(ed.w)+9,
      'stroke-opacity':.3, 'stroke-linecap':'round' }));

    edgesG.appendChild(svgEl('path', {
      d:g.d, fill:'none', stroke:ed.color, 'stroke-width':ed.w, 'stroke-dasharray':ed.dash,
      'marker-start': (ed.dir === 'both' || ed.dir === 'back') ? mk : '',
      'marker-end':   (ed.dir === 'both' || ed.dir === 'fwd')  ? mk : '' }));

    const hit = svgEl('path', { class:'hit', d:g.d, fill:'none', stroke:'transparent', 'stroke-width':16 });
    hit.addEventListener('pointerdown', ev => { ev.stopPropagation(); selectEdge(ed.id); });
    edgesG.appendChild(hit);

    if (ed.label) {
      const t = svgEl('text', {
        x:g.mid.x + (g.vert ? 14 : 0), y:g.mid.y + (g.vert ? -6 : -9),
        'text-anchor': g.vert ? 'start' : 'middle',
        'font-size':12, 'font-weight':800, fill:ed.color, 'font-family':'Pretendard, sans-serif',
        stroke:'#ffffff', 'stroke-width':5, 'stroke-linejoin':'round', 'paint-order':'stroke fill' });
      t.textContent = ed.label;
      edgesG.appendChild(t);
    }
  });
}

/* ============================ 크기 조절 손잡이 ============================ */
function drawHandles() {
  if (sel.length !== 1 || editMode) { handlesEl.hidden = true; return; }
  const n = byId(sel[0]);
  if (!n) { handlesEl.hidden = true; return; }
  handlesEl.hidden = false;
  handlesEl.style.left = n.x + 'px'; handlesEl.style.top = n.y + 'px';
  handlesEl.style.width = n.w + 'px'; handlesEl.style.height = n.h + 'px';
  if (!handlesEl.children.length) {
    ['nw','n','ne','e','se','s','sw','w'].forEach(h => {
      const d = document.createElement('div');
      d.className = 'hnd'; d.dataset.h = h;
      d.addEventListener('pointerdown', ev => startResize(ev, h));
      handlesEl.appendChild(d);
    });
  }
}

function startResize(e, dir) {
  e.stopPropagation();
  const n = byId(sel[0]); if (!n) return;
  const s = { mx:e.clientX, my:e.clientY, x:n.x, y:n.y, w:n.w, h:n.h };
  const onMove = ev => {
    const dx = ev.clientX - s.mx, dy = ev.clientY - s.my;
    let { x, y, w, h } = s;
    if (dir.includes('e')) w = s.w + dx;
    if (dir.includes('s')) h = s.h + dy;
    if (dir.includes('w')) { w = s.w - dx; x = s.x + dx; }
    if (dir.includes('n')) { h = s.h - dy; y = s.y + dy; }
    if (w < 40) { w = 40; if (dir.includes('w')) x = s.x + s.w - 40; }
    if (h < 28) { h = 28; if (dir.includes('n')) y = s.y + s.h - 28; }
    Object.assign(n, { x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h) });
    layout();
  };
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    persist();
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}

/* ============================ 드래그 / 선택 ============================ */
function attachInteractions(el, n) {
  el.querySelectorAll('.ports i').forEach(dot => {
    dot.addEventListener('pointerdown', ev => {
      if (!linking) return;
      ev.stopPropagation(); pickLink(n.id, dot.dataset.port);
    });
  });

  el.addEventListener('pointerdown', e => {
    if (linking) { e.stopPropagation(); pickLink(n.id, 'auto'); return; }
    if (editMode || e.target.isContentEditable || e.button !== 0) return;
    e.stopPropagation();

    if (e.shiftKey) { toggleSel(n.id); return; }
    if (!sel.includes(n.id)) selectNodes([n.id]);

    const start = { mx:e.clientX, my:e.clientY };
    const orig = sel.map(id => { const m = byId(id); return { n:m, x:m.x, y:m.y }; });
    let moved = false;

    const onMove = ev => {
      const dx = ev.clientX - start.mx, dy = ev.clientY - start.my;
      if (!moved) {
        if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
        moved = true; el.classList.add('dragging');
      }
      let ox = dx, oy = dy;
      if (snapOn && !ev.altKey && orig.length === 1) {
        const s = snap(n, orig[0].x + dx, orig[0].y + dy);
        ox = s.nx - orig[0].x; oy = s.ny - orig[0].y;
      } else hideGuides();
      orig.forEach(o => {
        o.n.x = Math.max(0, Math.min(canvas.clientWidth  - o.n.w, Math.round(o.x + ox)));
        o.n.y = Math.max(0, Math.min(canvas.clientHeight - o.n.h, Math.round(o.y + oy)));
      });
      layout();
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      el.classList.remove('dragging'); hideGuides();
      if (moved) persist();
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  });

  const txt = el.querySelector('.n-text');
  txt.addEventListener('dblclick', ev => { ev.stopPropagation(); beginEdit(n, txt); });
  el.querySelectorAll('.badge').forEach(b => {
    b.addEventListener('dblclick', ev => { ev.stopPropagation(); editBadge(n, b); });
  });
}

/* 빈 곳: 드래그하면 여러 개 선택, 더블클릭하면 새 글상자 */
canvas.addEventListener('pointerdown', e => {
  if (e.target.closest('.nd') || e.target.closest('.hit') || e.target.closest('.hnd')) return;
  if (editMode || linking || e.button !== 0) return;
  clearSelection();
  const r0 = canvas.getBoundingClientRect();
  const sx = e.clientX - r0.left, sy = e.clientY - r0.top;
  let active = false;

  const onMove = ev => {
    const cx = ev.clientX - r0.left, cy = ev.clientY - r0.top;
    if (!active && Math.abs(cx-sx) < 4 && Math.abs(cy-sy) < 4) return;
    active = true; marquee.style.display = 'block';
    marquee.style.left = Math.min(sx,cx) + 'px'; marquee.style.top = Math.min(sy,cy) + 'px';
    marquee.style.width = Math.abs(cx-sx) + 'px'; marquee.style.height = Math.abs(cy-sy) + 'px';
  };
  const onUp = ev => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    marquee.style.display = 'none';
    if (!active) return;
    const cx = ev.clientX - r0.left, cy = ev.clientY - r0.top;
    const box = { x1:Math.min(sx,cx), y1:Math.min(sy,cy), x2:Math.max(sx,cx), y2:Math.max(sy,cy) };
    selectNodes(nodes.filter(n =>
      n.x < box.x2 && n.x + n.w > box.x1 && n.y < box.y2 && n.y + n.h > box.y1).map(n => n.id));
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
});
canvas.addEventListener('dblclick', e => {
  if (e.target.closest('.nd') || e.target.closest('.hit')) return;
  const r0 = canvas.getBoundingClientRect();
  addNode(e.clientX - r0.left, e.clientY - r0.top);
});

/* ============================ 글상자 편집 ============================ */
function beginEdit(n, f) {
  if (f.getAttribute('contenteditable') === 'true' && document.activeElement === f) return;
  f.setAttribute('contenteditable', 'true');
  f.focus();
  const r = document.createRange(); r.selectNodeContents(f);
  const s = document.getSelection(); s.removeAllRanges(); s.addRange(r);

  const done = () => {
    f.removeEventListener('blur', done); f.removeEventListener('keydown', onKey); f.removeEventListener('paste', onPaste);
    if (!editMode) f.removeAttribute('contenteditable');
    n.t = f.innerHTML.trim();
    persist();
  };
  const onKey = ev => {
    ev.stopPropagation();
    if (ev.key === 'Escape') { ev.preventDefault(); f.blur(); }
    // Enter 는 줄바꿈. 편집을 끝내려면 Esc 또는 바깥 클릭.
    if (ev.key === 'Enter') {
      ev.preventDefault();
      document.execCommand('insertLineBreak');
    }
  };
  const onPaste = ev => {                       // 서식 없는 글자만 붙여넣기
    ev.preventDefault();
    const t = (ev.clipboardData || window.clipboardData).getData('text');
    document.execCommand('insertText', false, t);
  };
  f.addEventListener('blur', done);
  f.addEventListener('keydown', onKey);
  f.addEventListener('paste', onPaste);
}

function editBadge(n, el) {
  const i = Number(el.dataset.bi);
  const v = prompt('배지 내용 (비우면 삭제)', n.badges[i].x);
  if (v === null) return;
  if (v.trim() === '') n.badges.splice(i, 1); else n.badges[i].x = v.trim();
  rebuildNode(n); persist();
}
function addBadge() {
  const n = byId(sel[0]); if (!n) return flash('먼저 객체를 선택하세요');
  const v = prompt('배지 내용', '표시'); if (!v) return;
  (n.badges = n.badges || []).push({ p:'r', x:v.trim() });
  rebuildNode(n); persist();
}
function rebuildNode(n) {
  const old = canvas.querySelector(`.nd[data-id="${n.id}"]`);
  const el = makeNodeEl(n);
  old.replaceWith(el);
  if (sel.includes(n.id)) el.classList.add('sel');
  if (editMode) el.querySelector('.n-text').setAttribute('contenteditable','true');
  layout();
}

function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  const b = document.getElementById('editBtn');
  b.textContent = editMode ? '✅ 편집 완료' : '✏️ 텍스트 편집';
  b.classList.toggle('on', editMode);
  canvas.querySelectorAll('.n-text').forEach(f => {
    if (editMode) f.setAttribute('contenteditable','true'); else f.removeAttribute('contenteditable');
  });

    flash('텍스트 편집 모드 — 아무 글자나 클릭해 수정 · Enter 로 줄바꿈 (객체 이동 잠금)'); }
  else { harvestTexts(); flash('편집 내용을 저장했습니다'); }

function harvestTexts() {
  nodes.forEach(n => {
    const el = canvas.querySelector(`.nd[data-id="${n.id}"]`);

/* ============================ 스냅 ============================ */
function toggleSnap() {
  snapOn = !snapOn;
  document.getElementById('snapBtn').classList.toggle('on', snapOn);
  flash(snapOn ? '스냅 켬 — Alt 를 누른 채 끌면 일시 해제' : '스냅 끔 — 완전히 자유롭게 이동합니다');
}
function snap(n, nx, ny) {
  let gx = null, gy = null;
  const cx = nx + n.w/2, cy = ny + n.h/2;
  for (const o of nodes) {
    if (o.id === n.id) continue;
    const r = rect(o);
    if (gy === null) {
      if (Math.abs(cy - r.cy) < SNAP)                 { ny = r.cy - n.h/2; gy = r.cy; }
      else if (Math.abs(ny - r.y) < SNAP)             { ny = r.y;          gy = r.y; }
      else if (Math.abs(ny + n.h - (r.y+r.h)) < SNAP) { ny = r.y+r.h-n.h;  gy = r.y+r.h; }
    }
    if (gx === null) {
      if (Math.abs(cx - r.cx) < SNAP)                 { nx = r.cx - n.w/2; gx = r.cx; }
      else if (Math.abs(nx - r.x) < SNAP)             { nx = r.x;          gx = r.x; }
      else if (Math.abs(nx + n.w - (r.x+r.w)) < SNAP) { nx = r.x+r.w-n.w;  gx = r.x+r.w; }
    }
  }
  showGuide(guideH, gy, 'top'); showGuide(guideV, gx, 'left');
  return { nx, ny };
}
function showGuide(el, v, prop) {
  if (v === null) { el.style.display = 'none'; return; }
  el.style.display = 'block'; el.style[prop] = v + 'px';
}
const hideGuides = () => { guideH.style.display = 'none'; guideV.style.display = 'none'; };

/* ============================ 선택 ============================ */
function selectNodes(ids) {
  sel = ids; selEdge = null;
  canvas.querySelectorAll('.nd').forEach(el => el.classList.toggle('sel', sel.includes(el.dataset.id)));
  refreshProps(); layout();
}
function toggleSel(id) {
  selectNodes(sel.includes(id) ? sel.filter(x => x !== id) : sel.concat(id));
}
function selectEdge(id) {
  sel = []; selEdge = id;
  canvas.querySelectorAll('.nd').forEach(el => el.classList.remove('sel'));
  refreshProps(); layout();
  const e = edgeById(id);
  if (e) flash(`화살표: ${plain(byId(e.a).t)} → ${plain(byId(e.b).t)}`);
}
function clearSelection() { selectNodes([]); }

/* ============================ 속성바 ============================ */
function refreshProps() {
  const one = sel.length === 1 ? byId(sel[0]) : null;
  const many = sel.length > 1;
  const e = edgeById(selEdge);
  document.getElementById('pbNode').hidden = !one;
  document.getElementById('pbMulti').hidden = !many;
  document.getElementById('pbEdge').hidden = !e;
  document.getElementById('pbHint').hidden = !!(one || many || e);

  if (one) {
    document.getElementById('pbNodeName').textContent = plain(one.t);
    document.getElementById('fsVal').textContent = one.fs + 'px';
    mark('#shapeBtns', 'shape', one.shape);
    mark('#themeBtns', 'th', one.custom ? '' : one.th, '.sw');
    document.getElementById('nodeColor').value =
      (one.custom ? one.custom.fill : (THEMES[one.th] || THEMES.plain).fill).replace('none', '#ffffff');
    mark('#taBtns', 'ta', one.ta); mark('#vaBtns', 'va', one.va);
    document.getElementById('emphBtn').classList.toggle('on', !!one.emph);
  }
  if (many) document.getElementById('pbMultiName').textContent = `객체 ${sel.length}개 선택`;
  if (e) {
    document.getElementById('pbEdgeName').textContent = `${plain(byId(e.a).t)} → ${plain(byId(e.b).t)}`;
    mark('#portA', 'p', e.pa); mark('#portB', 'p', e.pb);
    mark('#dirBtns', 'dir', e.dir);
    mark('#lineBtns', 'dash', e.dash ? 'dash' : 'solid');
    mark('#lineBtns', 'route', e.route);
    mark('#colorBtns', 'color', e.color, '.sw');
    document.getElementById('edgeColor').value = e.color;
    document.getElementById('ewVal').textContent = e.w + 'px';
    const br = document.getElementById('bendRange');
    br.value = e.bend || 0; br.disabled = e.route === 'ortho';
  }
}
function mark(scope, key, val, q = '.tb-btn') {
  document.querySelectorAll(`${scope} ${q}`).forEach(b => {
    if (b.dataset[key] != null) b.classList.toggle('on', b.dataset[key] === String(val));
  });
}
function mkBtn(parent, dataKey, val, label, fn, cls = 'tb-btn') {
  const b = document.createElement('button');
  b.className = cls; b.dataset[dataKey] = val; b.textContent = label;
  b.onclick = fn; parent.appendChild(b); return b;
}

/* ============================ 객체 속성 ============================ */
function setNodeProp(key, val) {
  const targets = sel.map(byId).filter(Boolean);
  if (!targets.length) return flash('먼저 객체를 선택하세요');
  targets.forEach(n => { n[key] = val; if (key === 'th') delete n.custom; });
  layout(); persist(); refreshProps();
}

/* 색을 직접 고르면 테두리·글자색은 밝기에 맞춰 자동으로 정합니다 */
const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
function shade(h, f) {
  return '#' + hex2rgb(h).map(v => Math.round(Math.max(0, Math.min(255, v * f)))
    .toString(16).padStart(2,'0')).join('');
}
function setCustomFill(fill) {
  const targets = sel.map(byId).filter(Boolean);
  if (!targets.length) return flash('먼저 객체를 선택하세요');
  const [r,g,b] = hex2rgb(fill);
  const lum = 0.299*r + 0.587*g + 0.114*b;
  const custom = { fill, stroke: shade(fill, lum > 150 ? 0.86 : 1), text: lum > 150 ? '#39424f' : '#ffffff' };
  targets.forEach(n => n.custom = { ...custom });
  layout(); persist(); refreshProps();
}
function toggleEmph() {
  const n = byId(sel[0]); if (!n) return flash('먼저 객체를 선택하세요');
  setNodeProp('emph', !n.emph);
}
function bumpFont(d) {
  const targets = sel.map(byId).filter(Boolean);
  if (!targets.length) return flash('먼저 객체를 선택하세요');
  targets.forEach(n => n.fs = Math.max(8, Math.min(72, n.fs + d)));
  layout(); persist(); refreshProps();
}
function zOrder(d) {
  const targets = sel.map(byId).filter(Boolean);
  if (!targets.length) return;
  const zs = nodes.map(n => n.z);
  targets.forEach(n => n.z = d > 0 ? Math.max(...zs) + 1 : Math.min(...zs) - 1);
  layout(); persist();
}

function addNode(x, y) {
  const n = materializeNode({
    id: uid('n'), x: Math.round((x ?? canvas.clientWidth/2) - 90), y: Math.round((y ?? canvas.clientHeight/2) - 30),
    w: 180, h: 60, th:'plain', shape:'round', t:'새 글상자', fs: 20,
    z: Math.max(...nodes.map(n => n.z), 3) + 1,
  });
  n.x = Math.max(0, Math.min(canvas.clientWidth - n.w, n.x));
  n.y = Math.max(0, Math.min(canvas.clientHeight - n.h, n.y));
  nodes.push(n);
  canvas.appendChild(makeNodeEl(n));
  selectNodes([n.id]); persist();
  const f = canvas.querySelector(`.nd[data-id="${n.id}"] .n-text`);
  beginEdit(n, f);
  flash('새 글상자를 추가했습니다 — 바로 입력하세요');
}
function duplicateSel() {
  if (!sel.length) return flash('먼저 객체를 선택하세요');
  const copies = sel.map(byId).filter(Boolean).map(o => {
    const n = clone(o); n.id = uid('n'); n.x += 20; n.y += 20;
    nodes.push(n); canvas.appendChild(makeNodeEl(n)); return n.id;
  });
  selectNodes(copies); persist(); flash('복제했습니다');
}
function deleteSel() {
  if (selEdge) {
    edges = edges.filter(e => e.id !== selEdge);
    selEdge = null; layout(); persist(); refreshProps();
    return flash('화살표를 삭제했습니다');
  }
  if (!sel.length) return flash('먼저 삭제할 대상을 선택하세요');
  const del = new Set(sel);
  nodes = nodes.filter(n => !del.has(n.id));
  edges = edges.filter(e => !del.has(e.a) && !del.has(e.b));   // 연결선도 함께 정리
  canvas.querySelectorAll('.nd').forEach(el => { if (del.has(el.dataset.id)) el.remove(); });
  selectNodes([]); persist();
  flash(`객체 ${del.size}개를 삭제했습니다`);
}

/* ============================ 여러 개 정렬 ============================ */
function alignSel(mode) {
  const t = sel.map(byId).filter(Boolean);
  if (t.length < 2) return flash('두 개 이상 선택하세요');
  const L = Math.min(...t.map(n=>n.x)), R = Math.max(...t.map(n=>n.x+n.w));
  const T = Math.min(...t.map(n=>n.y)), B = Math.max(...t.map(n=>n.y+n.h));
  t.forEach(n => {
    if (mode === 'l')  n.x = L;
    if (mode === 'r')  n.x = R - n.w;
    if (mode === 'cx') n.x = Math.round((L + R)/2 - n.w/2);
    if (mode === 't')  n.y = T;
    if (mode === 'b')  n.y = B - n.h;
    if (mode === 'cy') n.y = Math.round((T + B)/2 - n.h/2);
  });
  layout(); persist(); flash('정렬했습니다');
}
function distribute(axis) {
  const t = sel.map(byId).filter(Boolean);
  if (t.length < 3) return flash('세 개 이상 선택하세요');
  const key = axis === 'h' ? 'x' : 'y', size = axis === 'h' ? 'w' : 'h';
  t.sort((a,b) => a[key] - b[key]);
  const first = t[0], last = t[t.length-1];
  const span = (last[key] + last[size]) - first[key];
  const total = t.reduce((s,n) => s + n[size], 0);
  const gap = (span - total) / (t.length - 1);
  let p = first[key];
  t.forEach(n => { n[key] = Math.round(p); p += n[size] + gap; });
  layout(); persist(); flash('균등 배분했습니다');
}
/* 선택한 것 중 홀로 떨어진 하나를 부모로 보고, 나머지를 트리로 연결한다.
   시작점은 모두 부모의 가운데(위 또는 아래)로 맞추고 가로 줄기를 공유한다. */
function treeConnect() {
  const t = sel.map(byId).filter(Boolean);
  if (t.length < 3) return flash('부모 1개와 자식 2개 이상을 선택하세요');

  const sorted = [...t].sort((a, b) => (a.y + a.h/2) - (b.y + b.h/2));
  const top = sorted[0], bottom = sorted[sorted.length - 1];
  // 위쪽에 홀로 있으면 아래로 뻗는 트리, 아래쪽에 홀로 있으면 위로 뻗는 트리
  const downward = (sorted[1].y + sorted[1].h/2) - (top.y + top.h/2)
                 >= (bottom.y + bottom.h/2) - (sorted[sorted.length-2].y + sorted[sorted.length-2].h/2);
  const parent = downward ? top : bottom;
  const kids = t.filter(n => n.id !== parent.id);
  const [pa, pb] = downward ? ['b','t'] : ['t','b'];

  kids.forEach(k => {
    let e = edges.find(x => (x.a === parent.id && x.b === k.id) || (x.a === k.id && x.b === parent.id));
    if (!e) { e = materializeEdge({ id: uid('e'), a: parent.id, b: k.id, color:'#8b95a1', w:3, dir:'fwd' }); edges.push(e); }
    Object.assign(e, { a: parent.id, b: k.id, pa, pb, route: 'ortho', bend: 0 });
  });
  layout(); persist();
  flash(`${plain(parent.t)} 아래로 ${kids.length}개를 트리로 연결했습니다`);
}

function matchSize(dim) {
  const t = sel.map(byId).filter(Boolean);
  if (t.length < 2) return flash('두 개 이상 선택하세요');
  const v = t[0][dim];
  t.forEach(n => n[dim] = v);
  layout(); persist(); flash('크기를 맞췄습니다');
}

/* ============================ 화살표 ============================ */
function setEdgeProp(key, val) {
  const e = edgeById(selEdge); if (!e) return flash('먼저 화살표를 선택하세요');
  e[key] = val;
  if (key === 'route' && val === 'ortho') e.bend = 0;
  layout(); persist(); refreshProps();
}
function bumpEdgeWidth(d) {
  const e = edgeById(selEdge); if (!e) return flash('먼저 화살표를 선택하세요');
  e.w = Math.round(Math.max(1, Math.min(14, e.w + d)) * 10) / 10;
  layout(); persist(); refreshProps();
}
function setBend(v) {
  const e = edgeById(selEdge); if (!e) return;
  e.bend = Number(v); e.route = 'curve';
  layout(); persist(); refreshProps();
}
function swapEnds() {
  const e = edgeById(selEdge); if (!e) return flash('먼저 화살표를 선택하세요');
  [e.a, e.b] = [e.b, e.a]; [e.pa, e.pb] = [e.pb, e.pa];
  layout(); persist(); refreshProps();
}

function toggleLinking() {
  linking = !linking; linkFrom = null;
  document.body.classList.toggle('linking', linking);
  canvas.querySelectorAll('.linksrc').forEach(el => el.classList.remove('linksrc'));
  const b = document.getElementById('linkBtn');
  b.classList.toggle('on', linking);
  b.textContent = linking ? '✖ 연결 취소' : '🔗 연결선';
  if (linking) { if (editMode) toggleEditMode(); clearSelection();
    flash('시작 객체를 클릭하세요 — 테두리의 ○ 을 누르면 연결부를 지정합니다'); }
  else flash(HINT);
}
function pickLink(id, port) {
  if (!linkFrom) {
    linkFrom = { id, port };
    canvas.querySelector(`.nd[data-id="${id}"]`).classList.add('linksrc');
    flash(`시작: ${plain(byId(id).t)} (${port === 'auto' ? '자동' : port})  ·  도착 객체를 클릭하세요`);
    return;
  }
  if (linkFrom.id === id) return flash('같은 객체입니다. 다른 객체를 클릭하세요');
  const ne = materializeEdge({ id: uid('e'), a: linkFrom.id, b: id, pa: linkFrom.port, pb: port });
  edges.push(ne);
  linkFrom = null; toggleLinking();
  layout(); persist(); selectEdge(ne.id);
  flash('화살표를 추가했습니다 — 아래에서 연결부와 모양을 바꿀 수 있습니다');
}

/* ============================ 키보드 ============================ */
document.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.isContentEditable) return;
  if (e.key === 'Escape') { if (linking) toggleLinking(); else clearSelection(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSel(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSel(); return; }
  if (e.key.startsWith('Arrow') && sel.length) {
    e.preventDefault();
    const d = e.shiftKey ? 10 : 1;
    const dx = e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0;
    const dy = e.key === 'ArrowUp'   ? -d : e.key === 'ArrowDown'  ? d : 0;
    sel.map(byId).forEach(n => {
      n.x = Math.max(0, Math.min(canvas.clientWidth  - n.w, n.x + dx));
      n.y = Math.max(0, Math.min(canvas.clientHeight - n.h, n.y + dy));
    });
    layout(); persist();
  }
});

/* ============================ 저장 / 복원 ============================ */
function currentTexts() {
  const texts = {};
  staticTexts().forEach(el => texts[el.dataset.k] = el.innerHTML);
  return texts;
}
function applyState(data) {
  if (!data || !Array.isArray(data.nodes) || !data.nodes.length) return false;
  nodes = data.nodes.map(materializeNode);
  edges = (data.edges || []).map(materializeEdge);
  if (data.texts) staticTexts().forEach(el => {
    if (data.texts[el.dataset.k] != null) el.innerHTML = data.texts[el.dataset.k];
  });
  return true;
}
function persist() {
  localStorage.setItem(STORE_KEY, JSON.stringify({ nodes, edges, texts: currentTexts() }));
  savedTick();
}
let savedTimer;
function savedTick() {                       // 자동 저장되고 있음을 알려준다
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => {
    if (statusEl.textContent === HINT || statusEl.textContent === '') flash('자동 저장됨');
  }, 400);
}

/* ---------- 파일로 저장 / 불러오기 ---------- */
/* 파일 이름은 영문으로만 짓는다.
   한글이 섞이면 브라우저가 이름을 버리고 확장자 없는 'download' 로 받아버려
   나중에 그 파일이 열리지 않는다. */
function downloadURL(name, url, revoke) {
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a);          // 문서에 붙여야 파일 이름이 그대로 적용된다
  a.click();
  a.remove();
  if (revoke) setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function download(name, text, type) {
  downloadURL(name, URL.createObjectURL(new Blob([text], { type })), true);
}
const stamp = () => new Date().toISOString().slice(0,16).replace(/[-T:]/g,'').replace(/^(\d{8})/,'$1-');
const fileName = ext => `collab-diagram_${stamp()}.${ext}`;

/* 지금 화면 그대로가 담긴 HTML 을 통째로 내려받는다 */
function exportHTML() {
  if (editMode) toggleEditMode();
  if (linking) toggleLinking();
  if (document.activeElement) document.activeElement.blur();
  clearSelection(); hideGuides();

  const state = { docId: uid('doc'), savedAt: new Date().toISOString(), nodes, edges, texts: currentTexts() };
  const root = document.documentElement.cloneNode(true);
  const q = s => root.querySelector(s);

  // 실행 중에 만들어진 것들은 걷어낸다 — 파일을 열 때 다시 그려진다
  root.querySelectorAll('.nd').forEach(el => el.remove());
  ['#edges','#defs','#handles',
   '#shapeBtns','#themeBtns','#themeBtns2','#taBtns','#vaBtns','#alignBtns',
   '#portA','#portB','#dirBtns','#lineBtns','#colorBtns'].forEach(s => q(s).innerHTML = '');
  ['#marquee','#guideH','#guideV'].forEach(s => q(s).removeAttribute('style'));
  q('#handles').setAttribute('hidden','');
  q('#status').textContent = '';
  ['#pbNode','#pbMulti','#pbEdge'].forEach(s => q(s).setAttribute('hidden',''));
  q('#pbHint').removeAttribute('hidden');
  q('#editBtn').textContent = '✏️ 텍스트 편집'; q('#editBtn').classList.remove('on');
  q('#linkBtn').textContent = '🔗 연결선';      q('#linkBtn').classList.remove('on');
  q('#snapBtn').classList.toggle('on', snapOn);
  root.querySelector('body').className = '';
  q('#saved-state').textContent = JSON.stringify(state);

  download(fileName('html'), '<!DOCTYPE html>\n' + root.outerHTML, 'text/html;charset=utf-8');
  flash('현재 상태를 HTML 파일로 저장했습니다 — 그 파일을 열면 이어서 편집할 수 있습니다');
}

function exportJSON() {
  const state = { docId: uid('doc'), savedAt: new Date().toISOString(), nodes, edges, texts: currentTexts() };
  download(fileName('json'), JSON.stringify(state, null, 2), 'application/json');
  flash('배치 데이터를 .json 으로 저장했습니다');
}

/* 저장해 둔 HTML 이나 .json 에서 상태만 꺼내 현재 화면에 적용 */
function importFile(ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const txt = String(r.result);
    let data = null;
    try {
      if (/^\s*\{/.test(txt)) data = JSON.parse(txt);
      else {
        const m = txt.match(/id="saved-state"[^>]*>([\s\S]*?)<\/script>/);
        if (m && m[1].trim()) data = JSON.parse(m[1]);
      }
    } catch (e) { /* 아래에서 안내 */ }
    if (!data || !Array.isArray(data.nodes) || !data.nodes.length)
      return flash('이 파일에서는 도식 데이터를 찾지 못했습니다');
    if (!confirm('현재 화면을 불러온 내용으로 바꿉니다. 계속할까요?')) return;
    applyState(data);
    buildNodes(); clearSelection(); layout(); persist();
    flash(`불러왔습니다 (저장 시각 ${(data.savedAt || '').slice(0,16).replace('T',' ')})`);
  };
  r.readAsText(file);
}
function resetLayout() {
  if (!confirm('배치 · 도형 · 색 · 화살표 · 글자를 모두 초기 상태로 되돌립니다. 계속할까요?')) return;
  localStorage.removeItem(STORE_KEY);
  nodes = clone(DEFAULT_NODES).map(materializeNode);
  edges = clone(DEFAULT_EDGES).map(materializeEdge);
  staticTexts().forEach(el => { if (DEFAULT_TEXTS[el.dataset.k] != null) el.innerHTML = DEFAULT_TEXTS[el.dataset.k]; });
  buildNodes(); clearSelection(); layout();
  flash('초기 상태로 복원했습니다');
}

const HINT = '끌어서 이동 · 모서리로 크기 조절 · 더블클릭으로 글자 수정 · 작업은 자동 저장됨';
let flashTimer;
function flash(msg) {
  statusEl.textContent = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { statusEl.textContent = HINT; }, 3000);
}

/* ============================ 이미지 저장 ============================ */
function saveAsImage() {
  if (typeof html2canvas === 'undefined')
    return flash('이미지 저장 기능을 불러오지 못했습니다 — 인터넷 연결 후 새로고침하세요');
  if (editMode) toggleEditMode();
  if (linking) toggleLinking();
  if (document.activeElement) document.activeElement.blur();
  clearSelection(); hideGuides();
  flash('캡처 중…');
  html2canvas(document.getElementById('slide-container'),
    { scale:2, useCORS:true, backgroundColor:'#ffffff' }).then(cv => {
    downloadURL(fileName('png'), cv.toDataURL('image/png'));
    flash('이미지를 저장했습니다');
  });
}

const CORE_RULES = JSON.parse(document.getElementById('core-rules').textContent);
window.CORE_RULES = CORE_RULES;

init();
</script>
